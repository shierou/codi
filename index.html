<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Codi · 나의 옷장</title>
<style>
  :root{
    --bg:#11100d; --panel:#1a1916; --panel2:#222019;
    --ink:#f4f1ea; --sub:#9a9489; --line:#332f27; --accent:#c97b4a; --blue:#5aa0d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b0a08;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .head{padding:22px 22px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%)}
  .eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:700}
  .title{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .sub{font-size:13px;color:var(--sub);margin-top:3px}
  .row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  button{cursor:pointer;border:none;font:inherit;transition:all .15s}
  .tabs{display:flex;gap:6px;margin-top:16px}
  .tab{padding:10px 16px;border-radius:10px;background:transparent;color:var(--sub);font-weight:600;font-size:14px}
  .tab.on{background:var(--panel2);color:var(--ink)}
  .body{padding:18px}
  .wbadge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;color:var(--ink);text-align:right;min-width:160px}
  .wbadge .d{font-size:11px;color:var(--sub)}
  .wbadge .t{font-size:19px;font-weight:800;margin-top:1px}
  .wbadge .t small{font-size:13px;color:var(--sub);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px}
  .chip{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel2);color:var(--sub)}
  .chip.on{background:var(--accent);color:#1a1a1a}
  .swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);flex:0 0 auto}
  .inp{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
  .inp:focus{outline:2px solid #c97b4a55;border-color:var(--accent)}
  label.f{font-size:11.5px;color:var(--sub);display:block}
  label.f input,label.f select{margin-top:3px}
  .primary{background:var(--accent);color:#1a1a1a;font-weight:700;border-radius:10px;padding:11px}
  .ghost{background:var(--panel2);color:var(--sub);font-weight:600;border-radius:10px;padding:11px 18px}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="row">
      <div>
        <div class="eyebrow">CODI · 서울</div>
        <div class="title">나의 옷장</div>
        <div class="sub" id="subline">불러오는 중…</div>
      </div>
      <button class="wbadge" id="wbadge" title="날씨 새로고침">
        <div class="d" id="wdate">—</div>
        <div class="t" id="wtemp">—</div>
        <div class="d" id="wrain">—</div>
      </button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="today">오늘 코디</button>
      <button class="tab" data-tab="closet">옷장</button>
      <button class="tab" data-tab="add">추가</button>
    </div>
  </div>
  <div class="body" id="view"></div>
</div>

// ====== 저장 ======
const KEY="codi:wardrobe:v1";
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(Array.isArray(p)&&p.length)return p;}}catch(e){}return SEED.slice();}
function save(items){try{localStorage.setItem(KEY,JSON.stringify(items));return true;}catch(e){alert("저장 공간이 가득 찼어요. 사진은 용량을 많이 차지해요. 사진 일부를 삭제하거나, 텍스트는 CSV로 내보내 백업해 주세요.");return false;}}

// ====== 색상 → hex ======
function colorToHex(c){c=(c||"").toLowerCase();
  if(/인디고|indigo|다크인디고/.test(c))return"#34507a";
  if(/네이비|navy/.test(c))return"#1f2a44";
  if(/블루|blue/.test(c))return"#3b6ea5";
  if(/화이트|white|아이보리/.test(c))return"#f4f1ea";
  if(/그레이|grey|gray|melange|오트밀/.test(c))return"#9a9a93";
  if(/블랙|black|caviar/.test(c))return"#1a1a1a";
  if(/베이지|크림|누드/.test(c))return"#d8c9a8";
  if(/브라운|brown/.test(c))return"#5a3d28";
  if(/올리브|그린|green|세이지/.test(c))return"#6b7152";
  if(/purple|퍼플/.test(c))return"#7a5a8a";
  return"#b8b2a3";}

// ====== 코디 엔진 ======
// ====== v3 점수화 엔진 (코디_알고리즘_통합가이드_v3 반영) ======
// 파생 태그 추론 — 원본 필드(color/fit/material/name/note)에서 톤·명도·계절·격식·핏 도출
function _txt(i){return ((i&&i.name)||"")+" "+((i&&i.note)||"")+" "+((i&&i.material)||"")+" "+((i&&i.color)||"")+" "+((i&&i.fit)||"");}
function toneOf(i){const c=((i&&i.color)||"")+_txt(i);
  if(/인디고|네이비|그레이|블랙|차콜|navy|charcoal|caviar/i.test(c))return"COOL";
  if(/베이지|아이보리|크림|브라운|오트밀|카멜|탄|khaki|카키/i.test(c))return"WARM";
  if(/화이트|melange|멜란지|화이트|white/i.test(c))return"NEUTRAL";
  return"NEUTRAL";}
function valueOf(i){const c=((i&&i.color)||"")+_txt(i);
  if(/다크인디고|다크 인디고|블랙|네이비|차콜|인디고|raw|rigid|생지|셀비지/i.test(c))return"DARK";
  if(/아이보리|화이트|크림|베이지|오트밀|white/i.test(c))return"LIGHT";
  return"MID";}
function seasonOf(i){const c=_txt(i);
  if(/린넨|linen|에어리즘|반팔|심리스|메시/i.test(c))return"SS";
  if(/울|캐시미어|니트|코트|부츠|기모|플란넬/i.test(c))return"FW";
  return"ALL";}
function formalityOf(i){const c=_txt(i);
  if(/슬랙스|로퍼|구두|더비|드레스|해링턴|맥코트|블레이저|blazer|옥스포드 셔츠/i.test(c))return 3;
  if(/그래픽|릴렉스|반팔|tee|티셔츠|러닝|fresh foam|fuelcell|노바|슈퍼블라스트|삼바|samba/i.test(c))return 1;
  return 2;}
function fitCatOf(i){const f=((i&&i.fit)||"")+" "+((i&&i.name)||"");
  // 하이브리드 우선: 선호(스트레이트/레귤러)가 하나라도 있으면 선호로 분류 (5-C)
  const hasPref=/스트레이트|straight|레귤러|regular|501|502/i.test(f);
  const hasWide=/와이드|릴렉스|loose|wide|relax|550|555|568/i.test(f);
  const hasSlim=/슬림|테이퍼|slim|taper|511|541/i.test(f);
  if(hasPref)return"PREF";          // 레귤러·스트레이트 (하이브리드도 여기)
  if(hasWide)return"WIDE";
  if(hasSlim)return"SLIM";
  return"REGULARish";}
// 채도 높은 포인트 컬러 여부
function isVivid(i){return /피너츠|그래픽|caviar|purple|퍼플|레드|옐로|그린|오렌지|핑크/i.test(_txt(i));}
// 패턴
function patternOf(i){return (i&&i.pattern)||"";}

// 코어 3종(top,bottom,shoe) 점수 — 만점 100 + 선호 가중
function scoreCore(top,bottom,shoe){
  if(!top||!bottom)return null;
  const reasons=[];
  // --- 무효: SS+FW 직접 혼합 ---
  const seasons=[top,bottom,shoe].filter(Boolean).map(seasonOf);
  if(seasons.includes("SS")&&seasons.includes("FW"))return {invalid:true,reason:"SS+FW 계절 충돌"};
  // --- 무효: 상·하 동시 패턴 ---
  const pT=patternOf(top),pB=patternOf(bottom);
  const patterned=p=>p&&!/솔리드|무지|없음|plain/i.test(p);
  if(patterned(pT)&&patterned(pB))return {invalid:true,reason:"상·하 동시 패턴"};

  // ===== 색상 35 =====
  let color=0;
  const tones=[toneOf(top),toneOf(bottom)].concat(shoe?[toneOf(shoe)]:[]);
  const uniqTones=[...new Set(tones)];
  const cools=tones.filter(x=>x==="COOL").length, warms=tones.filter(x=>x==="WARM").length, neus=tones.filter(x=>x==="NEUTRAL").length;
  // 톤 일관성 15
  if(uniqTones.length===1){color+=15;reasons.push("톤 일관성 15");}
  else if(cools&&warms){ if(neus){color+=9;reasons.push("톤 완충 9");} else {color+=4;reasons.push("톤 충돌 4");} }
  else {color+=13;reasons.push("톤 근접 13");}
  // 명도 대비 12
  const vT=valueOf(top),vB=valueOf(bottom);
  const order={LIGHT:0,MID:1,DARK:2};
  const diff=Math.abs(order[vT]-order[vB]);
  if(diff===1){color+=12;reasons.push("명도 대비 12");}
  else if(diff===0){color+=7;reasons.push("원톤 7");}
  else {color+=9;reasons.push("명도차 9");}
  // 포인트 절제 8
  const vivids=[top,bottom,shoe].filter(Boolean).filter(isVivid).length;
  if(vivids<=1){color+=8;} else {color+=4;reasons.push("포인트 과다 4");}
  // 미니멀 보너스 +3
  if(tones.every(x=>x==="NEUTRAL"||x==="WARM")&&vivids===0&&diff<=1){color+=3;reasons.push("미니멀 +3");}

  // ===== 계절·소재 28 =====
  let sm=0;
  const sUniq=[...new Set(seasons)];
  if(sUniq.length===1){sm+=16;reasons.push("계절 일치 16");}
  else {sm+=13;reasons.push("ALL 혼합 13");}
  // 소재 질감 12: 매트 베이스 + 가죽 신발
  const leatherShoe=shoe&&/가죽|leather|로퍼|구두|더비/i.test(_txt(shoe));
  const allDenim=/데님/.test(top.material||"")&&/데님/.test(bottom.material||"");
  if(leatherShoe){sm+=12;reasons.push("질감 대비 12");}
  else if(allDenim){sm+=9;reasons.push("올데님 9");}
  else {sm+=10;}

  // ===== 실루엣 22 =====
  let sil=0;
  const fB=fitCatOf(bottom);
  const overTop=/오버|over|릴렉스|relax/i.test((top.fit||"")+(top.name||""));
  if(fB==="PREF"||fB==="REGULARish"){sil+=22;reasons.push("스트레이트·레귤러 22");}
  else if(fB==="WIDE"){sil+= overTop?10:18; reasons.push(overTop?"상하 볼륨 과다 10":"와이드 밸런스 18");}
  else if(fB==="SLIM"){sil+= overTop?18:12; reasons.push(overTop?"슬림+오버 18":"슬림 타이트 12");}
  // 신발 볼륨 보정 +2
  if(shoe&&/993|992|990|2002|1906/i.test(shoe.name||"")&&(fB==="PREF"||fB==="REGULARish"))sil=Math.min(22,sil+2);

  // ===== 격식 15 =====
  let form=0;
  const fset=[formalityOf(top),formalityOf(bottom)].concat(shoe?[formalityOf(shoe)]:[]);
  const fdiff=Math.max(...fset)-Math.min(...fset);
  if(fdiff===0){form+=15;reasons.push("격식 일치 15");}
  else if(fdiff===1){form+=12;reasons.push("시티 캐주얼 12");}
  else {form+=6;reasons.push("격식 편차 6");}

  let base=color+sm+sil+form;

  // ===== 개인 선호 가중 ± =====
  let pref=0;
  // 하의 다크 인디고 +5
  if(/다크인디고|다크 인디고/.test(bottom.color||"")|| (/인디고/.test(bottom.color||"")&&valueOf(bottom)==="DARK")){pref+=5;reasons.push("다크 인디고 +5");}
  else if(/인디고/.test(bottom.color||"")){pref+=5;reasons.push("인디고 +5");}
  // 핏 선호 (5-B + 하이브리드 5-C)
  if(fB==="PREF"){pref+=5;reasons.push("레귤러·스트레이트 +5");}
  else if(fB==="SLIM"){pref-=2;reasons.push("슬림 −2");}
  else if(fB==="WIDE"){pref-=4;reasons.push("와이드 −4");}

  const total=base+pref;
  let grade= total>=90?"A":total>=75?"B":total>=60?"C":"X";
  return {invalid:false,base:Math.round(base),pref,total:Math.round(total),grade,reasons};
}

// 아우터 정합 점수 (톤 일치/뉴트럴 우선) — 후보 정렬용
function outerFit(base,outer){
  if(!outer)return -1;
  let s=0; const bt=toneOf(base);
  const ot=toneOf(outer);
  if(ot===bt||ot==="NEUTRAL")s+=3;
  // 계절 충돌 제외
  const so=seasonOf(outer);
  return s;
}

function pick(a,s){return a.length?a[((s%a.length)+a.length)%a.length]:null;}
// TPO 상태 (전역) — 사용자가 오늘 코디 탭에서 토글
let TPO={move:"mixed",biz:false}; // move: transit(지하철/버스) | outdoor(실외) | mixed, biz: 비즈니스 캐주얼 변주
let REROLL=[0,0,0]; // 코디별 새로고침 시드 (전체 새로 버튼)

function fitGuide(item,role,t){
  // 기장/턱인 가이드 — 기온과 아이템 성격 반영
  const g=[];
  if(role==="bottom"){
    if(/데님|치노|슬랙스/.test((item.material||"")+(item.name||""))){
      if(t>=28)g.push("밑단 1~2회 롤업 → 발목 노출로 시각적 시원함");
      else if(t>=24)g.push("살짝 롤업하면 가벼운 인상");
    }
  }
  if(role==="top"){
    if(/오버|릴렉스|그래픽|반팔|tee/i.test((item.name||"")+(item.fit||""))) g.push("자연스럽게 빼서(Tuck-out) 편하게");
    else if(/셔츠|폴로|니트/.test(item.name||"")) g.push("앞만 살짝 넣는 프렌치턱이 비율에 유리");
  }
  return g;
}

function textureNote(top,bottom){
  // 텍스처 믹스 제안
  const roughBottom=/린넨|linen|568|생지|rigid|셀비지|raw|loose/i.test((bottom?.name||"")+(bottom?.material||""));
  const denimBottom=/데님/.test(bottom?.material||"");
  const smoothTop=/에어리즘|심리스|폴리|옥스포드|폴로/i.test(top?.name||"");
  const knitTop=/니트|캐시미어/.test((top?.name||"")+(top?.material||""));
  if(roughBottom&&smoothTop) return "질감 있는 하의엔 슬러브(slub) 티가 더 고급스러워요 — 매끈한 이너보다 거친 면을 매칭";
  if(roughBottom) return "거친 질감의 하의 + 살짝 슬러브 있는 상의로 소재 대비를 주면 입체감↑";
  if(denimBottom&&knitTop) return "데님의 거친 질감과 니트의 부드러움이 좋은 대비를 만들어요";
  if(denimBottom&&smoothTop) return "매끈한 상의라면 데님을 워싱·롤업해 질감을 살리면 밋밋함을 덜 수 있어요";
  return null;
}

function buildCodis(items,w){
  const t=w.high,rain=w.rain;
  const C=c=>items.filter(i=>i.cat===c);
  const outers=C("OT"),tops=C("TP"),bottoms=C("BT"),shoes=C("SH"),perfumes=C("PF"),accs=C("AC");
  const isHeavy=i=>/울|캐시미어|니트/.test((i.material||"")+(i.name||""));
  const isShort=i=>/반팔|tee|크루넥|오버사이즈 t|티셔츠/i.test(i.name||"")||/릴렉스/.test(i.fit||"");
  let band=t>=25?"hot":t>=19?"warm":t>=13?"mild":"cold";
  const wantTops=tops.filter(i=>band==="hot"?(isShort(i)&&!isHeavy(i)):band==="warm"?!isHeavy(i):true);
  const wantOuter=band==="hot"?[]:outers;
  const casualTops=wantTops.filter(i=>/그래픽|데님|오버|시티|캐주얼|반팔|tee/i.test((i.name||"")+(i.note||"")));
  const sneakers=shoes.filter(i=>!/로퍼|구두|더비|부츠|드레스/.test((i.name||"")+(i.note||"")));
  const dressShoes=shoes.filter(i=>/로퍼|구두|더비|드레스/.test((i.name||"")+(i.note||"")));
  const denim=bottoms.filter(i=>/데님/.test(i.material||""));
  const chinos=bottoms.filter(i=>/치노|슬랙스|혼방/.test((i.material||"")+(i.name||"")));
  // 액세서리 분류 (틀만 — 옷장에 추가되면 자동 반영)
  const watches=accs.filter(i=>/시계|watch|스트랩/i.test((i.name||"")+(i.note||"")));
  const bracelets=accs.filter(i=>/팔찌|체인|bracelet|뱅글/i.test((i.name||"")+(i.note||"")));
  const belts=accs.filter(i=>/벨트|belt/i.test((i.name||"")+(i.note||"")));
  const bagsTote=accs.filter(i=>/토트|tote/i.test((i.name||"")+(i.note||"")));
  const bagsMsg=accs.filter(i=>/메신저|크로스|messenger|숄더/i.test((i.name||"")+(i.note||"")));
  const blazers=outers.filter(i=>/블레이저|blazer/i.test((i.name||"")));
  const smartOuter=outers.filter(i=>/해링턴|윈드|블레이저|blazer/i.test(i.name||""));

  // ===== 상황(TPO)별 후보 풀 =====
  // 셔츠/니트/폴로 등 단정한 상의 (티셔츠 제외, 헤비니트 제외, 더운 날엔 니트 제외)
  const isDressTop=i=>{const n=i.name||"";return (/셔츠|폴로|옥스포드/.test(n)&&!/티셔츠|t셔츠/i.test(n))&&!isHeavy(i);};
  const smartTops=tops.filter(isDressTop).concat(
    band!=="hot"?tops.filter(i=>/니트/.test(i.name||"")&&!isHeavy(i)):[]
  ).filter((v,idx,a)=>a.indexOf(v)===idx);
  // 깔끔한 신발(로퍼·구두·미니멀 스니커즈)
  const cleanShoes=shoes.filter(i=>/스탠 스미스|stan|삼바|samba|로퍼|구두|더비|996|992|990|998|2002/i.test(i.name||""));
  // 데님 중 다크 인디고 우선
  const darkDenim=denim.filter(i=>/다크인디고|다크 인디고/.test(i.color||"")||(/인디고/.test(i.color||"")&&valueOf(i)==="DARK"));
  // 업무용 하의(슬랙스·치노·다크 데님, 와이드·릴렉스 제외)
  const notWide=i=>!/와이드|릴렉스|loose|wide|relax|550|555|568/i.test((i.fit||"")+(i.name||""));
  const workBottoms=chinos.concat(darkDenim).filter((v,idx,a)=>a.indexOf(v)===idx).filter(notWide);
  // 캐주얼 상의(그래픽·반팔·오버)
  const freeTops=wantTops.filter(i=>/그래픽|오버|반팔|tee|릴렉스/i.test((i.name||"")+(i.note||"")+(i.fit||"")));

  // TPO에 따른 신발/가방 선호
  function shoeForTPO(baseList,seed){
    if(TPO.move==="outdoor"){const flat=baseList.filter(i=>/860|1080|fresh|fuelcell|노바|슈퍼|2002|990|993|996/i.test(i.name||""));return pick(flat.length?flat:baseList,seed);}
    return pick(baseList,seed);
  }
  function bagSuggest(){
    if(!accs.length)return TPO.move==="transit"?{placeholder:"메신저/크로스백 (좁은 차내에서 거치적거림 적음)"}:TPO.move==="outdoor"?{placeholder:"토트/백팩 (짐 수납)"}:null;
    if(TPO.move==="transit")return bagsMsg[0]||null;
    if(TPO.move==="outdoor")return bagsTote[0]||null;
    return bagsMsg[0]||bagsTote[0]||null;
  }

  function accessoryLayer(style){
    // 실제 보유 우선, 없으면 placeholder(제안 틀)
    const out=[];
    if(style==="minimal"||style==="biz"){
      out.push(watches[0]||{placeholder:"가죽 스트랩 시계 — '준비된 룩'의 완성"});
      if(bracelets[0])out.push(bracelets[0]); else if(style==="minimal")out.push({placeholder:"실버 체인 팔찌 (선택)"});
    }else{
      if(watches[0])out.push(watches[0]);
    }
    if(belts[0]&&style!=="casual")out.push(belts[0]);
    return out;
  }

  const R=[];

  // 1 업무 (스마트 캐주얼 ~ 비즈니스)
  {
    const s=t+REROLL[0];
    const top=pick(smartTops.length?smartTops:wantTops,s);
    const bottom=pick(workBottoms.length?workBottoms:(chinos.length?chinos:bottoms),s+1);
    const wShoes=cleanShoes.length?cleanShoes:(dressShoes.length?dressShoes:sneakers);
    const shoe=shoeForTPO(wShoes.length?wShoes:shoes,s+2);
    const wOuter=(blazers[0]||smartOuter[0]||(band!=="hot"?pick(wantOuter,s+3):null))||null;
    R.push({title:"업무",vibe:"단정한 스마트 캐주얼 · 출근·미팅",accent:"#4a5a7a",style:"biz",
      slots:{outer:band==="hot"?null:wOuter,top,bottom,shoe},
      perfume:pick(perfumes.filter(p=>/우드|세이지|페어|wood|sage/i.test((p.name||"")+(p.brand||""))).length?perfumes.filter(p=>/우드|세이지|페어|wood|sage/i.test((p.name||"")+(p.brand||""))):perfumes,s),
      accessories:accessoryLayer("biz"),
      bag:bagSuggest(),
      texture:textureNote(top,bottom),
      fit:{top:fitGuide(top,"top",t),bottom:fitGuide(bottom,"bottom",t)}});
  }

  // 2 데이트 (단정하면서 멋낸 스마트 캐주얼)
  {
    const s=t+REROLL[1];
    // 데이트: 깔끔한 셔츠·니트 + 다크 인디고 데님 우선 + 가죽/미니멀 스니커즈
    const dTops=tops.filter(i=>(/셔츠|폴로/.test(i.name||"")&&!/티셔츠|t셔츠/i.test(i.name||""))&&!isHeavy(i)).concat(
      band!=="hot"?tops.filter(i=>/니트/.test(i.name||"")&&!isHeavy(i)):[]
    ).filter((v,idx,a)=>a.indexOf(v)===idx);
    const dBottoms=(darkDenim.length?darkDenim:denim).filter(notWide);
    const dBottomsF=dBottoms.length?dBottoms:(denim.length?denim:bottoms);
    const dShoes=cleanShoes.length?cleanShoes:sneakers;
    const top=pick(dTops.length?dTops:wantTops,s+4);
    const bottom=pick(dBottomsF,s+5);
    const shoe=shoeForTPO(dShoes.length?dShoes:shoes,s+6);
    // 데이트 향수: 우디·플로럴 계열 우선
    const dPerf=perfumes.filter(p=>/우드|플라워|피오니|가이악|레이지|wood|flower|peony/i.test((p.name||"")+(p.brand||"")));
    R.push({title:"데이트",vibe:"단정하면서 멋낸 스마트 캐주얼",accent:"#7a4a6b",style:"minimal",
      slots:{outer:band!=="hot"?pick(smartOuter.length?smartOuter:wantOuter,s+7):null,top,bottom,shoe},
      perfume:pick(dPerf.length?dPerf:perfumes,s+1),
      accessories:accessoryLayer("minimal"),
      bag:bagSuggest(),
      texture:textureNote(top,bottom),
      fit:{top:fitGuide(top,"top",t),bottom:fitGuide(bottom,"bottom",t)}});
  }

  // 3 자유 (편한 캐주얼 · 비 오면 방수 우선)
  {
    let vibe,accent,slots;
    const s=t+REROLL[2];
    if(rain){
      const ws=shoes.filter(i=>/방수|gtx|고어|ecco/i.test((i.note||"")+(i.brand||"")));
      const top=pick(freeTops.length?freeTops:wantTops,s+8),bottom=pick(bottoms.filter(i=>/다크|블랙|네이비|인디고/.test(i.color||"")),s)||pick(denim.length?denim:bottoms,s+9);
      vibe="비 오는 날 발 안 젖는 편한 캐주얼";accent="#c97b4a";
      slots={outer:pick(outers.filter(i=>/윈드|폴리|블루종/.test((i.name||"")+(i.material||""))),s)||pick(outers,s),top,bottom,shoe:pick(ws.length?ws:sneakers,s)};
    }else{
      const top=pick(freeTops.length?freeTops:wantTops,s+8);
      const bottom=pick(denim.length?denim:bottoms,s+9);
      vibe="편하고 가벼운 데일리 캐주얼";accent="#c97b4a";
      slots={outer:band!=="hot"?pick(wantOuter,s+12):null,top,bottom,shoe:shoeForTPO(sneakers.length?sneakers:shoes,s+11)};
    }
    R.push({title:"자유",vibe,accent,style:"casual",slots,perfume:pick(perfumes,s+2),
      accessories:accessoryLayer("casual"),bag:bagSuggest(),
      texture:textureNote(slots.top,slots.bottom),
      fit:{top:fitGuide(slots.top,"top",t),bottom:fitGuide(slots.bottom,"bottom",t)}});
  }
  // 각 코디에 원본 슬롯 번호 부여 (REROLL 인덱스 추적용)
  R.forEach((c,i)=>{c.origin=i;});
  // v3 점수화: 각 코디에 점수·등급·근거 부여
  R.forEach(c=>{
    const sc=scoreCore(c.slots.top,c.slots.bottom,c.slots.shoe);
    if(sc&&!sc.invalid){c.score=sc.total;c.base=sc.base;c.prefBonus=sc.pref;c.grade=sc.grade;c.reasons=sc.reasons;}
    else {c.score=null;c.grade=sc?"X":null;c.invalidReason=sc&&sc.reason;c.reasons=[];}
  });
  // 상황(업무·데이트·자유) 고정 순서 유지 — 정렬하지 않음. 점수는 배지로만 표시.
  return R;
}

}
// 특정 역할의 대체 아이템 풀
function altPool(role,items,w){
  const C=c=>items.filter(i=>i.cat===c);
  if(role==="outer")return C("OT");
  if(role==="top")return C("TP");
  if(role==="bottom")return C("BT");
  if(role==="shoe")return C("SH");
  return [];
}

let MANUAL=null;          // 수동 설정 {high,low,cond,rain} (있으면 예보 무시)

async function fetchWeather(){
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Asia%2FSeoul&forecast_days=7";
    const res=await fetch(url);
    const j=await res.json();
    const d=j.daily;
    FORECAST=d.time.map((date,k)=>({
      date,
      high:Math.round(d.temperature_2m_max[k]),
      low:Math.round(d.temperature_2m_min[k]),
      code:d.weather_code[k],
      rainProb:d.precipitation_probability_max[k]||0
    }));
    if(!SELECTED_DATE)SELECTED_DATE=FORECAST[0].date;
    applyWeather();
  }catch(e){ WEATHER.loading=false; WEATHER.cond="날씨 불러오기 실패(수동 설정 가능)"; renderWeather(); if(currentTab==="today")render(); }
}

// 선택 날짜·수동 설정을 WEATHER에 반영
function applyWeather(){
  if(MANUAL){
    WEATHER={high:MANUAL.high,low:MANUAL.low,cond:MANUAL.cond,rain:MANUAL.rain,date:(SELECTED_DATE||new Date().toISOString().slice(0,10))+" (수동)",loading:false,manual:true};
  }else if(FORECAST){
    const f=FORECAST.find(x=>x.date===SELECTED_DATE)||FORECAST[0];
    WEATHER={high:f.high,low:f.low,cond:condText(f.code),
      rain:f.rainProb>=50||[51,53,55,61,63,65,80,81,82,95,96,99].includes(f.code),
      date:f.date,loading:false,manual:false};
  }
  renderWeather(); if(currentTab==="today") render();
}

function condText(c){
  if(c===0)return"맑음"; if([1,2].includes(c))return"대체로 맑음"; if(c===3)return"흐림";
  if([45,48].includes(c))return"안개"; if([51,53,55].includes(c))return"이슬비";
  if([61,63,65,80,81,82].includes(c))return"비"; if([71,73,75,85,86].includes(c))return"눈";
  if([95,96,99].includes(c))return"뇌우"; return"보통";
}

function applyOverrides(codis){
  codis.forEach((c)=>{
    const key=typeof c.origin==="number"?c.origin:codis.indexOf(c);
    const ov=CODI_OVERRIDES[key];if(!ov)return;
    Object.keys(ov).forEach(role=>{
      const it=ITEMS.find(i=>i.code===ov[role]);
      if(it)c.slots[role]=it;
    });
    // 수정 시 핏/텍스처 가이드 재계산
    c.fit={top:fitGuide(c.slots.top,"top",WEATHER.high),bottom:fitGuide(c.slots.bottom,"bottom",WEATHER.high)};
    c.texture=textureNote(c.slots.top,c.slots.bottom);
    // 수정 시 점수 재계산
    const sc=scoreCore(c.slots.top,c.slots.bottom,c.slots.shoe);
    if(sc&&!sc.invalid){c.score=sc.total;c.base=sc.base;c.prefBonus=sc.pref;c.grade=sc.grade;c.reasons=sc.reasons;c.invalidReason=null;}
    else {c.score=null;c.grade="X";c.invalidReason=sc&&sc.reason;c.reasons=[];}
  });
  return codis;
}

function bindTPO(){
  view.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>{TPO.move=b.dataset.move;CODI_OVERRIDES={};render();}));
  const bz=document.getElementById("tpo-biz");

}

function bindCodiEdits(){
  // 슬롯 교체 (다음 아이템으로 순환)
  view.querySelectorAll("[data-swap]").forEach(b=>b.addEventListener("click",()=>{
    const [idxs,role]=b.dataset.swap.split(":");const idx=+idxs;
    const c=CURRENT_CODIS[idx];const cur=c.slots[role];
    const origin=c&&typeof c.origin==="number"?c.origin:idx;
    const pool=altPool(role,ITEMS,WEATHER);
    if(pool.length<2){toast("교체할 다른 "+ROLE_LABEL[role]+"이(가) 없어요");return;}
    const ci=pool.findIndex(i=>i.code===(cur&&cur.code));
    const next=pool[(ci+1+pool.length)%pool.length];
    CODI_OVERRIDES[origin]=CODI_OVERRIDES[origin]||{};CODI_OVERRIDES[origin][role]=next.code;
    render();
  }));
  // 전체 새로 (해당 코디 시드를 흔들어 새 조합 생성)
  view.querySelectorAll("[data-reroll]").forEach(b=>b.addEventListener("click",()=>{
    const idx=+b.dataset.reroll;
    const c=CURRENT_CODIS[idx];
    const origin=c&&typeof c.origin==="number"?c.origin:idx;
    delete CODI_OVERRIDES[origin];           // 해당 코디의 수동 교체 초기화
    REROLL[origin]=(REROLL[origin]||0)+7;     // 시드 점프(+7)로 다른 조합 유도
    render();
  }));
}

  const inp=document.getElementById("chat-in"),send=document.getElementById("chat-send");
  if(!inp)return;
  const go=()=>{const t=inp.value.trim();if(!t)return;CHAT_LOG.push({role:"user",text:t});inp.value="";handleChat(t);};
  send.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}

function targetCodiIdx(text){
  const m=text.match(/코디\s*([123])/);if(m)return +m[1]-1;
  return 0; // 기본 코디1
}
function handleChat(text){
  const t=text.replace(/\s/g,"");
  const idx=targetCodiIdx(text);
  // TPO 변경
  if(/지하철|버스|대중교통|transit/i.test(t)){TPO.move="transit";CODI_OVERRIDES={};chatSay("지하철·버스 이동에 맞춰 거치적거림 적은 가방과 편한 신발 위주로 바꿨어요.");render();return;}
  if(/실외|야외|아웃도어|걷|outdoor/i.test(t)){TPO.move="outdoor";CODI_OVERRIDES={};chatSay("실외 활동에 맞춰 쿠셔닝 좋은 신발과 수납 가방으로 조정했어요.");render();return;}
  if(/비즈니스|회사|출근|격식|블레이저|biz/i.test(t)){TPO.biz=true;CODI_OVERRIDES={};chatSay("코디2를 비즈니스 캐주얼로 바꿨어요. 블레이저와 드레스 슈즈를 더했어요.");render();return;}
  if(/캐주얼하게|편하게|가볍게|더캐주얼/i.test(t)){TPO.biz=false;TPO.move="mixed";CODI_OVERRIDES={};chatSay("더 편안한 캐주얼 톤으로 풀었어요.");render();return;}
  // 슬롯 교체
  const roleMap=[["shoe",/신발|운동화|슈즈|스니커|로퍼|구두/],["bottom",/하의|바지|팬츠|데님|청바지|진|슬랙스/],["top",/상의|티|셔츠|니트|탑/],["outer",/아우터|자켓|코트|블루종|점퍼/]];
  for(const [role,re] of roleMap){
    if(re.test(t)){
      const c=CURRENT_CODIS[idx];const cur=c.slots[role];const pool=altPool(role,ITEMS,WEATHER);
      if(pool.length<2){chatSay("교체할 다른 "+ROLE_LABEL[role]+"이(가) 옷장에 부족해요.");return;}
      const ci=pool.findIndex(i=>i.code===(cur&&cur.code));const next=pool[(ci+1+pool.length)%pool.length];
      CODI_OVERRIDES[idx]=CODI_OVERRIDES[idx]||{};CODI_OVERRIDES[idx][role]=next.code;
      chatSay(`코디${idx+1}의 ${ROLE_LABEL[role]}을(를) ${next.brand?next.brand+" ":""}${next.name}(으)로 바꿨어요.`);render();return;
    }
  }
  // 롤업/턱인 안내
  if(/롤업|걷어|기장/.test(t)){chatSay("28도 안팎이면 밑단 1~2회 롤업으로 발목을 드러내면 시각적으로 시원해요. 데님·치노에 특히 잘 어울려요.");return;}
  if(/턱인|넣어|tuck/i.test(t)){chatSay("셔츠·폴로는 앞만 살짝 넣는 '프렌치 턱'이 비율에 유리하고, 오버핏 티는 빼서 입는 편이 자연스러워요.");return;}
  if(/새로|다시|바꿔만|랜덤/.test(t)){CODI_OVERRIDES={};render();chatSay("세 코디를 다시 뽑았어요.");return;}
  // 도움말
  chatSay('이렇게 말해보세요: "코디1 신발 바꿔줘", "더 캐주얼하게", "비즈니스로", "지하철 많이 타", "롤업 어때"');
}

function bindWeatherPanel(){
  // 날짜 칩
  view.querySelectorAll("[data-date]").forEach(b=>b.addEventListener("click",()=>{
    SELECTED_DATE=b.dataset.date; MANUAL=null; applyWeather();
  }));
  // 수동 토글
  const mt=document.getElementById("w-manual");
  if(mt)mt.addEventListener("change",()=>{
    if(mt.checked){
      const base=(FORECAST&&(FORECAST.find(x=>x.date===SELECTED_DATE)||FORECAST[0]))||{high:WEATHER.high,low:WEATHER.low};
      MANUAL={high:base.high,low:base.low,cond:condText(base.code!=null?base.code:0)||"맑음",rain:false};
      // cond/ rain 초기값 보정
      if(!COND_OPTIONS.some(([c])=>c===MANUAL.cond))MANUAL.cond="맑음";
      MANUAL.rain=(COND_OPTIONS.find(([c])=>c===MANUAL.cond)||[,false])[1];
    }else{MANUAL=null;}
    applyWeather();
  });
  // 수동 기온
  const wh=document.getElementById("w-high"),wl=document.getElementById("w-low");
  if(wh){wh.addEventListener("input",()=>{MANUAL.high=+wh.value;applyWeatherKeepPanel();});wh.addEventListener("change",()=>{MANUAL.high=+wh.value;applyWeather();});}
  if(wl){wl.addEventListener("input",()=>{MANUAL.low=+wl.value;applyWeatherKeepPanel();});wl.addEventListener("change",()=>{MANUAL.low=+wl.value;applyWeather();});}

// 색상을 그룹으로 정규화 (필터용)
function colorGroup(color){
  const c=(color||"").toLowerCase();
  if(!c)return"기타";
  if(/인디고|네이비|블루|블루|navy|indigo|blue|데님/.test(c))return"블루·인디고";
  if(/블랙|차콜|black|charcoal|caviar/.test(c))return"블랙";
  if(/화이트|아이보리|크림|white|ivory/.test(c))return"화이트·아이보리";
  if(/그레이|회색|melange|멜란지|gray|grey/.test(c))return"그레이";
  if(/베이지|카멜|탄|오트밀|brown|브라운|beige|khaki|카키/.test(c))return"베이지·브라운";
  return"기타";
}
// 용도 추론 (note·name·카테고리에서)
function useOf(i){
  const n=(i.name||"").toLowerCase(), t=(n+(i.note||"")).toLowerCase();
  // 신발은 종류로 세분
  if(i.cat==="SH"){
    if(/fresh foam|fuelcell|노바|슈퍼블라스트|860|1080/i.test(n))return"운동";
    if(/로퍼|구두|더비|부츠|드레스/i.test(n))return"업무·포멀";
    return"캐주얼";
  }
  if(/출근|비즈니스|미팅|슬랙스|로퍼|구두|해링턴|블레이저|옥스포드|폴로/i.test(t))return"업무·포멀";
  if(/운동|러닝|짐|트레이닝/i.test(t))return"운동";
  if(/이너|레이어드|심리스|에어리즘/i.test(t))return"이너·기본";
  if(/그래픽|캐주얼|시티|아메리카나|포인트|반팔|릴렉스|오버/i.test(t)||/티셔츠/.test(n))return"캐주얼";
  if(i.cat==="PF")return"향수";
  if(i.cat==="AC")return"소품";
  return"공용";
}

// ====== 전체 백업 (JSON, 사진 포함) ======
function exportBackup(){
  const payload={app:"codi-wardrobe",version:1,exportedAt:new Date().toISOString(),count:ITEMS.length,items:ITEMS};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="codi-백업-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function handleBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=JSON.parse(reader.result);}catch(e){alert("백업 파일을 읽지 못했어요. 올바른 JSON 백업 파일인지 확인해주세요.");return;}
    const arr=Array.isArray(data)?data:(data&&Array.isArray(data.items)?data.items:null);
    if(!arr){alert("이 파일에서 옷장 데이터를 찾지 못했어요.");return;}
    const valid=arr.filter(i=>i&&i.name);
    if(!valid.length){alert("복원할 항목이 없어요.");return;}
    const photoN=valid.filter(i=>i.photo).length;
    if(!confirm(`백업 복원: ${valid.length}벌${photoN?` (사진 ${photoN}장 포함)`:""}\n\n현재 옷장을 이 백업으로 전체 교체합니다. 계속할까요?`))return;
    ITEMS=valid.map(i=>({...i,cat:CATEGORIES[i.cat]?i.cat:"UN"}));
    if(save(ITEMS)){
      CLOSET.cat="ALL";renderWeather();render();
      alert("복원 완료 · 현재 "+ITEMS.length+"벌");
    }
  };
  reader.readAsText(file,"utf-8");
}

// ====== CSV 입출력 ======
const CSV_FIELDS=["code","cat","brand","name","size","color","pattern","fit","material","price","date","note"];
const CSV_HEADERS=["품목코드","카테고리","브랜드","모델명","사이즈","색상","패턴","핏","소재","가격","구매일","비고"];

function csvCell(v){v=(v==null?"":String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  const rows=[CSV_HEADERS.join(",")];
  ITEMS.forEach(i=>rows.push(CSV_FIELDS.map(f=>csvCell(i[f])).join(",")));
  const csv="\uFEFF"+rows.join("\r\n"); // BOM for Excel 한글
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="codi-옷장-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// 헤더 한글/영문 모두 인식
const HEADER_MAP={};
CSV_HEADERS.forEach((h,idx)=>HEADER_MAP[h]=CSV_FIELDS[idx]);
CSV_FIELDS.forEach(f=>HEADER_MAP[f]=f);

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch=='"'){if(text[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch=='"')q=true;
      else if(ch==","){row.push(cur);cur="";}
      else if(ch=="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else if(ch=="\r"){}
      else cur+=ch;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}

function handleCSVFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const rows=parseCSV(reader.result);
      if(rows.length<2){alert("데이터 행이 없어요. 첫 줄은 헤더, 둘째 줄부터 항목이어야 합니다.");return;}
      const head=rows[0].map(h=>h.trim());
      const fieldByCol=head.map(h=>HEADER_MAP[h]||null);
      const parsed=[];
      for(let r=1;r<rows.length;r++){
        const obj={};
        rows[r].forEach((val,c)=>{const f=fieldByCol[c];if(f)obj[f]=val.trim();});
        if(!obj.name)continue;
        if(!obj.cat||!CATEGORIES[obj.cat])obj.cat="UN";
        parsed.push(obj);
      }
      if(!parsed.length){alert("인식된 항목이 없어요. '모델명'(name) 열이 있는지 확인해주세요.");return;}
      openImportModal(parsed);
    }catch(e){alert("CSV를 읽는 중 문제가 생겼어요: "+e.message);}
  };
  reader.readAsText(file,"utf-8");
}

function openImportModal(parsed){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px";
  ov.innerHTML=`<div class="card" style="padding:22px;max-width:380px;width:100%">
    <div style="font-size:17px;font-weight:800;margin-bottom:6px">CSV 가져오기</div>
    <div style="font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:18px"><b style="color:var(--ink)">${parsed.length}개</b> 항목을 읽었어요. 어떻게 반영할까요?</div>
    <div style="display:grid;gap:9px">
      <button class="primary" data-mode="merge" style="text-align:left;padding:13px">기존 목록에 추가 (병합)<div style="font-size:11px;font-weight:500;color:#1a1a1a;opacity:.7;margin-top:2px">같은 품목코드는 새 내용으로 덮어씀</div></button>
      <button class="ghost" data-mode="replace" style="text-align:left;padding:13px;color:var(--ink)">전체 교체 (덮어쓰기)<div style="font-size:11px;font-weight:500;color:var(--sub);margin-top:2px">현재 옷장을 지우고 이 파일로 교체</div></button>
      <button class="ghost" data-mode="cancel" style="padding:11px">취소</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{
    if(e.target===ov){ov.remove();return;}
    const btn=e.target.closest("[data-mode]");if(!btn)return;
    const mode=btn.dataset.mode;
    if(mode==="cancel"){ov.remove();return;}
    applyImport(parsed,mode);
    ov.remove();
  });
}

function applyImport(parsed,mode){
  // 코드 없는 항목은 카테고리별 다음 코드 자동 부여
  if(mode==="replace"){
    const used={};
    ITEMS=[];
    parsed.forEach(p=>{
      if(!p.code){const cat=p.cat;used[cat]=(used[cat]||0)+1;p.code=cat+String(used[cat]).padStart(3,"0");}
    });
    ITEMS=parsed.slice();
  }else{ // merge
    parsed.forEach(p=>{
      if(p.code){
        const idx=ITEMS.findIndex(i=>i.code===p.code);
        if(idx>=0)ITEMS[idx]={...ITEMS[idx],...p};
        else ITEMS.push(p);
      }else{
        p.code=nextCode(p.cat);ITEMS.push(p);
      }
    });
  }
  save(ITEMS);
  CLOSET.cat="ALL";
  renderWeather();render();
  alert((mode==="replace"?"전체 교체":"병합")+" 완료 · 현재 "+ITEMS.length+"벌");
}

function val(id){return document.getElementById(id).value;}

// 사진 리사이즈 (가로 최대 800px, JPEG 압축)
function resizePhoto(file,cb){
  const img=new Image();
  const fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{
    const max=800,scale=Math.min(1,max/img.width);
    const w=Math.round(img.width*scale),hh=Math.round(img.height*scale);
    const cv=document.createElement("canvas");cv.width=w;cv.height=hh;
    cv.getContext("2d").drawImage(img,0,0,w,hh);
    try{cb(cv.toDataURL("image/jpeg",0.72));}catch(e){alert("이미지를 처리하지 못했어요.");}
  };img.onerror=()=>alert("이미지를 읽지 못했어요.");img.src=fr.result;};
  fr.readAsDataURL(file);
}

// URL에서 이미지 불러와 압축 (CORS 실패 시 onfail 호출)
function resizePhotoFromUrl(url,cb,onfail){
  // 1차: crossOrigin으로 로드 시도 → 성공 시 canvas 압축
  const img=new Image();
  img.crossOrigin="anonymous";
  let done=false;
  const timer=setTimeout(()=>{if(!done){done=true;tryFallback();}},12000);
  function tryFallback(){
    // 2차: crossOrigin 없이 로드해 '표시는 되는지' 확인 후 원본 URL 저장
    const img2=new Image();
    let done2=false;
    const t2=setTimeout(()=>{if(!done2){done2=true;onfail&&onfail();}},12000);
    img2.onload=()=>{if(done2)return;done2=true;clearTimeout(t2);onfail&&onfail();};
    img2.onerror=()=>{if(done2)return;done2=true;clearTimeout(t2);onfail&&onfail();};
    img2.src=url;
  }
  img.onload=()=>{
    if(done)return;done=true;clearTimeout(timer);
    try{
      const max=800,scale=Math.min(1,max/img.width);
      const w=Math.round(img.width*scale),hh=Math.round(img.height*scale);
      const cv=document.createElement("canvas");cv.width=w;cv.height=hh;
      cv.getContext("2d").drawImage(img,0,0,w,hh);
      const data=cv.toDataURL("image/jpeg",0.72); // CORS 오염 시 throw
      cb(data,true);
    }catch(e){ tryFallback(); }
  };
  img.onerror=()=>{
    if(done)return;done=true;clearTimeout(timer);
    tryFallback();
  };
  img.src=url;
}

function startEdit(code){
  const it=ITEMS.find(i=>i.code===code);if(!it)return;
  window._editCode=code;
  window._draft={cat:it.cat,brand:it.brand||"",name:it.name||"",size:it.size||"",color:it.color||"",material:it.material||"",note:it.note||"",photo:it.photo||"",pattern:it.pattern||"",fit:it.fit||"",price:it.price||"",date:it.date||""};
  currentTab="add";setTab();render();
}
