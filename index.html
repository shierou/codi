<!doctype html>

<head>

<title>Codi · 나의 옷장</title>
<style>
  :root{
    --bg:#11100d; --panel:#1a1916; --panel2:#222019;
    --ink:#f4f1ea; --sub:#9a9489; --line:#332f27; --accent:#c97b4a; --blue:#5aa0d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b0a08;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .head{padding:22px 22px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%)}
  .eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:700}
  .title{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .sub{font-size:13px;color:var(--sub);margin-top:3px}
  .row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  button{cursor:pointer;border:none;font:inherit;transition:all .15s}
  .tabs{display:flex;gap:5px;margin-top:16px;flex-wrap:wrap}
  .tab{padding:9px 12px;border-radius:10px;background:transparent;color:var(--sub);font-weight:600;font-size:13px}
  .tab.on{background:var(--panel2);color:var(--ink)}
  .body{padding:18px}
  .wbadge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;color:var(--ink);text-align:right;min-width:160px}
  .wbadge .d{font-size:11px;color:var(--sub)}
  .wbadge .t{font-size:19px;font-weight:800;margin-top:1px}
  .wbadge .t small{font-size:13px;color:var(--sub);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px}
  .chip{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel2);color:var(--sub)}
  .chip.on{background:var(--accent);color:#1a1a1a}
  .swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);flex:0 0 auto}
  .inp{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
  .inp:focus{outline:2px solid #c97b4a55;border-color:var(--accent)}
  label.f{font-size:11.5px;color:var(--sub);display:block}
  label.f input,label.f select{margin-top:3px}
  .primary{background:var(--accent);color:#1a1a1a;font-weight:700;border-radius:10px;padding:11px}
  .ghost{background:var(--panel2);color:var(--sub);font-weight:600;border-radius:10px;padding:11px 18px}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>

<div class="wrap">

</div>

const SUBCATS={
  TP:["티셔츠","카라티","셔츠","맨투맨","니트"],
  BT:["청바지","면바지","슬랙스"],

  SH:["스니커즈","로퍼·구두","러닝화","부츠"],
  AC:["액세서리"], PF:["향수"], UN:["기타"]
};
// 아이템의 소분류 자동 추론 (i.sub 지정 시 우선)
function subOf(i){
  if(i.sub)return i.sub;
  const n=(i.name||""), t=n+(i.material||"")+(i.note||"");
  switch(i.cat){
    case"TP":
      if(/니트|캐시미어|스웨터/.test(t))return"니트";
      if(/맨투맨|스웨트|후드/.test(t))return"맨투맨";
      if(/폴로|카라|피케/.test(t))return"카라티";
      if(/티셔츠|t셔츠|반팔|tee|크루넥|그래픽|오버사이즈 t/i.test(n))return"티셔츠";
      if(/셔츠|옥스포드|체크|플란넬|스트라이프/.test(n))return"셔츠";
      return"티셔츠";
    case"BT":
      if(/데님|청바지|jean|501|502|505|511|541|550|555|565|568/i.test(t))return"청바지";
      if(/슬랙스|정장|드레스/.test(t))return"슬랙스";
      return"면바지"; // 치노·코튼·혼방
    case"OT":
      if(/코트|coat|맥코트/.test(t))return"코트";
      if(/블레이저|blazer/.test(t))return"블레이저";
      if(/트러커|트럭커|trucker/.test(t))return"트러커";
      if(/셔츠 자켓|셔켓|셔츠자켓|오버셔츠/.test(t))return"셔츠자켓";
      if(/윈드|바람막이|블루종|폴리|집업/.test(t))return"바람막이";
      if(/가디건|cardigan/.test(t))return"가디건";
      return"자켓";
    case"SH":
      if(/부츠|boot/.test(t))return"부츠";
      if(/fresh foam|fuelcell|노바|슈퍼블라스트|860|1080|러닝/i.test(t))return"러닝화";
      if(/로퍼|구두|더비|드레스/.test(t))return"로퍼·구두";
      return"스니커즈";
    case"AC":return"액세서리";
    case"PF":return"향수";
    default:return"기타";
  }
}

function mergeRequired(items){
  const out=items.slice();let changed=false;
  const outerCorrections={
    OT004:{brand:"Uniqlo",name:"해링턴 자켓",color:"올리브",note:"캐주얼 해링턴 아우터"},

    // 핸드볼 스페지알 2족을 스웨이드/가죽으로 분리 — SH008은 스웨이드로 확정
    SH008:{brand:"Adidas",name:"핸드볼 스페지알 스웨이드",color:"크림",material:"스웨이드",note:"크림 스웨이드 갑피 · 네이비 삼선 · 검 밑창 · 부드러운 질감"}
  };
  Object.entries(outerCorrections).forEach(([code,fields])=>{
    const idx=out.findIndex(item=>item.code===code);if(idx<0)return;
    if(Object.entries(fields).some(([key,value])=>out[idx][key]!==value)){
      out[idx]={...out[idx],...fields};changed=true;
    }
  });
  const oversizedIndex=out.findIndex(item=>item.code==="TP031");
  if(oversizedIndex>=0&&out[oversizedIndex].fit!=="오버사이즈"){
    const current=out[oversizedIndex];
    out[oversizedIndex]={...current,fit:"오버사이즈",note:[current.note,"풀아웃 또는 셔츠 아우터 연출 권장"].filter(Boolean).join(" · ")};
    changed=true;
  }
  // 가디건은 겉옷으로 입으므로 아우터(OT)로 이동 — 이전 버전에서 TP023으로 저장된 옷장도 옮긴다
  const cardiIdx=out.findIndex(i=>i.code==="TP023");
  if(cardiIdx>=0&&!out.some(i=>i.code==="OT006")){
    out[cardiIdx]={...out[cardiIdx],code:"OT006",cat:"OT",sub:"가디건"};changed=true;
  }else if(cardiIdx>=0){
    out.splice(cardiIdx,1);changed=true;   // OT006이 이미 있으면 옛 항목은 중복이라 제거
  }
  const homewearIndex=out.findIndex(i=>i.code==="TP013");
  if(homewearIndex>=0&&out[homewearIndex].use!=="홈웨어"){
    const current=out[homewearIndex];
    out[homewearIndex]={...current,use:"홈웨어",note:[current.note,"집에서만 착용 · 외출 코디 추천 제외"].filter(Boolean).join(" · ")};
    changed=true;
  }
  for(const required of REQUIRED_ITEMS){
    const exists=out.some(i=>{
      if(i.cat!==required.cat)return false;
      if(i.code===required.code)return true;
      const text=((i.brand||"")+" "+(i.name||"")+" "+(i.material||"")+" "+(i.note||"")).toLowerCase();
      if(required.code==="BT033")return /straight selvedge b32 raw|스트레이트 셀비지 b32/.test(text);
      if(required.code==="AC002")return /natural grain|내추럴 그레인/.test(text);
      if(required.code==="AC003")return /bridle|브라이들/.test(text);
      if(required.code==="TP021")return /non ?stock/.test(text)&&/인디고|靛蓝|indigo|블루/.test((i.color||"")+text);
      if(required.code==="TP022")return /non ?stock/.test(text)&&/블랙|black|黑/.test((i.color||"")+text);
      if(required.code==="OT006")return /메리노|merino/.test(text)&&/가디건|cardigan/.test(text);
      if(required.code==="BT034")return /atong|阿瞳/.test(text);
      if(required.code==="SH036")return /스페지알 레더|스페지알 가죽|spezial leather/.test(text);
      if(/^TP02[456]$/.test(required.code))return /tompkins/.test(text)&&(i.color||"")===required.color;
      return false;
    });
    if(exists)continue;
    let code=required.code;
    if(out.some(i=>i.code===code)){
      const nums=out.filter(i=>i.cat===required.cat).map(i=>parseInt(String(i.code||"").slice(2),10)).filter(Number.isFinite);
      code=required.cat+String((nums.length?Math.max(...nums):32)+1).padStart(3,"0");
    }
    out.push({...required,code});changed=true;
  }
  return{items:out,changed};
}

function _txt(i){return ((i&&i.name)||"")+" "+((i&&i.note)||"")+" "+((i&&i.material)||"")+" "+((i&&i.color)||"")+" "+((i&&i.fit)||"");}

// ===== 온도 범위 프리셋 (℃) =====
// 아이템에 tmin/tmax가 있으면 그대로, 없으면 카테고리+소재+이름으로 추론
function tempRange(i){
  // 사용자가 직접 지정한 값 우선
  const lo=i.tmin, hi=i.tmax;
  if(lo!=null&&lo!==""&&hi!=null&&hi!==""){return [Number(lo),Number(hi)];}
  const txt=((i.name||"")+(i.material||"")+(i.note||"")+(i.fit||"")).toLowerCase();
  const heavyKnit=/캐시미어|울100|두꺼운|기모|헤비/.test(txt);
  const knit=/니트|스웨터/.test(txt);
  const linenTee=/린넨|linen|에어리즘|반팔|심리스|메시|tee\b/.test(txt)||/반팔/.test(i.name||"");
  const longTee=/긴팔|롱슬리브|long/.test(txt);
  switch(i.cat){
    case"TP": // 상의
      if(heavyKnit)return[-5,12];
      if(knit)return[5,18];
      if(linenTee)return[22,40];
      if(/셔츠|폴로|옥스포드/.test(txt)&&!/티셔츠/.test(txt))return[14,30];
      return[16,30]; // 일반 면 상의
    case"BT": // 하의
      if(/반바지|쇼츠|숏|short/.test(txt))return[23,40];
      if(/기모|코듀로이|울|두꺼운/.test(txt))return[-5,13];
      if(/린넨|linen/.test(txt))return[20,38];
      if(/데님|denim/.test(txt))return[3,30];
      if(/슬랙스|치노|면|코튼/.test(txt))return[10,32];
      return[8,32];
    case"OT": // 아우터
      if(/코트|coat|맥코트|패딩|다운/.test(txt))return[-5,12];
      if(/해링턴|블레이저|blazer/.test(txt))return[8,20];
      if(/데님|트러커|트럭커/.test(txt))return[7,21];
      if(/윈드|블루종|셔켓|셔츠형|집업/.test(txt))return[10,23];
      return[8,22];
    case"SH": // 신발
      if(/부츠|boot/.test(txt))return[-5,14];
      if(/샌들|슬리퍼|sandal/.test(txt))return[22,40];
      return[0,35]; // 스니커즈 등 사계절
    default:
      return[-10,40]; // AC·PF 등은 사실상 전온도
  }
}
// 기온 t가 옷 범위에 맞는지: 'in'(적정) | 'edge'(살짝 벗어남, 감점) | 'out'(크게 벗어남, 제외)
function tempFit(i,t){
  const [lo,hi]=tempRange(i);
  if(t>=lo&&t<=hi)return"in";
  const margin=4; // 4도까지는 edge
  if(t<lo&&lo-t<=margin)return"edge";
  if(t>hi&&t-hi<=margin)return"edge";
  return"out";
}

// 온도 범위 → 계절 태그 자동 도출. 사용자가 i.season을 직접 지정하면 그 값 우선.
// 반환: "봄","여름","가을","겨울","간절기","사계절" 중 하나 이상을 담은 배열
function seasonsOf(i){
  // 사용자 지정 우선 (쉼표 구분 문자열 또는 배열)
  if(i.season){
    const arr=Array.isArray(i.season)?i.season:String(i.season).split(/[,\s]+/).filter(Boolean);
    if(arr.length)return arr;
  }
  const [lo,hi]=tempRange(i);
  // 계절별 대표 기온대(한국): 겨울 ≤8, 봄·가을 9~22(간절기), 여름 ≥23
  const out=new Set();
  if(lo<=8)out.add("겨울");
  if(hi>=9&&lo<=22)out.add("간절기"); // 봄·가을 통합
  if(hi>=23)out.add("여름");
  // 전 범위(예: 신발·향수)면 사계절
  if(lo<=5&&hi>=30){out.clear();out.add("사계절");}
  if(!out.size)out.add("간절기");
  return [...out];
}
// 현재 기온이 어떤 계절인지
function seasonNow(t){
  if(t>=23)return"여름";
  if(t<=8)return"겨울";

}
// 아이템이 현재 계절에 맞는지 (추천 가중용)
function seasonMatch(i,t){
  const now=seasonNow(t);

}
function formalityOf(i){const c=_txt(i);
  if(/슬랙스|로퍼|구두|더비|드레스|해링턴|맥코트|블레이저|blazer|옥스포드 셔츠/i.test(c))return 3;
  if(/그래픽|릴렉스|반팔|tee|티셔츠|러닝|fresh foam|fuelcell|노바|슈퍼블라스트/i.test(c))return 1;
  return 2;}
function fitCatOf(i){const f=((i&&i.fit)||"")+" "+((i&&i.name)||"");
  // 하이브리드 우선: 선호(스트레이트/레귤러)가 하나라도 있으면 선호로 분류 (5-C)
  const hasPref=/스트레이트|straight|레귤러|regular|501|502/i.test(f);
  const hasWide=/와이드|릴렉스|loose|wide|relax|550|555|568/i.test(f);
  const hasSlim=/슬림|테이퍼|slim|taper|511|541/i.test(f);
  if(hasPref)return"PREF";          // 레귤러·스트레이트 (하이브리드도 여기)
  if(hasWide)return"WIDE";
  if(hasSlim)return"SLIM";
  return"REGULARish";}
// 채도 높은 포인트 컬러 여부
function isVivid(i){return /피너츠|그래픽|caviar|purple|퍼플|레드|옐로|그린|오렌지|핑크/i.test(_txt(i));}
// 패턴
function patternOf(i){return (i&&i.pattern)||"";}

// 코어 3종(top,bottom,shoe) 점수 — 만점 100 + 선호 가중
function scoreCore(top,bottom,shoe){
  if(!top||!bottom)return null;
  const reasons=[];
  // --- 무효: SS+FW 직접 혼합 ---
  const seasons=[top,bottom,shoe].filter(Boolean).map(seasonOf);
  if(seasons.includes("SS")&&seasons.includes("FW"))return {invalid:true,reason:"SS+FW 계절 충돌"};
  // --- 무효: 상·하 동시 패턴 ---
  const pT=patternOf(top),pB=patternOf(bottom);
  const patterned=p=>p&&!/솔리드|무지|없음|plain/i.test(p);
  if(patterned(pT)&&patterned(pB))return {invalid:true,reason:"상·하 동시 패턴"};

  // ===== 색상 35 =====
  let color=0;
  const tones=[toneOf(top),toneOf(bottom)].concat(shoe?[toneOf(shoe)]:[]);
  const uniqTones=[...new Set(tones)];
  const cools=tones.filter(x=>x==="COOL").length, warms=tones.filter(x=>x==="WARM").length, neus=tones.filter(x=>x==="NEUTRAL").length;
  // 톤 일관성 15
  if(uniqTones.length===1){color+=15;reasons.push("톤 일관성 15");}
  else if(cools&&warms){ if(neus){color+=9;reasons.push("톤 완충 9");} else {color+=4;reasons.push("톤 충돌 4");} }
  else {color+=13;reasons.push("톤 근접 13");}
  // 명도 대비 12 = 상하 대비(9) + 신발 앵커(3)
  const vT=valueOf(top),vB=valueOf(bottom);
  const order={LIGHT:0,MID:1,DARK:2};
  const diff=Math.abs(order[vT]-order[vB]);
  if(diff===1){color+=9;reasons.push("명도 대비 9");}
  else if(diff===0){color+=5;reasons.push("원톤 5");}
  else {color+=7;reasons.push("명도차 7");}
  // 신발 앵커: 신발 명도가 하의와 이어지면 다리선 연장(+3), 상의와 호응(+2), 그 외(+1)
  if(shoe){
    const vS=valueOf(shoe);
    if(vS===vB){color+=3;reasons.push("신발-하의 연결 +3");}
    else if(vS===vT){color+=2;reasons.push("신발-상의 호응 +2");}
    else {color+=1;reasons.push("신발 중립 +1");}
  }
  // 포인트 절제 8
  const vivids=[top,bottom,shoe].filter(Boolean).filter(isVivid).length;
  if(vivids<=1){color+=8;} else {color+=4;reasons.push("포인트 과다 4");}
  // 미니멀 보너스 +3
  if(tones.every(x=>x==="NEUTRAL"||x==="WARM")&&vivids===0&&diff<=1){color+=3;reasons.push("미니멀 +3");}

  // ===== 계절·소재 28 =====
  let sm=0;
  const sUniq=[...new Set(seasons)];
  if(sUniq.length===1){sm+=16;reasons.push("계절 일치 16");}
  else {sm+=13;reasons.push("ALL 혼합 13");}
  // 소재 질감 12: 가죽 12 / 올데님 9 / 러닝·기능화+단정상의 8 / 그 외 10
  const leatherShoe=shoe&&/가죽|leather|로퍼|구두|더비/i.test(_txt(shoe));
  const runShoe=shoe&&/fresh foam|fuelcell|노바|슈퍼블라스트|860|1080|러닝|컴포트/i.test(_txt(shoe));
  const dressTop=/셔츠|폴로|니트/.test(top.name||"")&&!/티셔츠/i.test(top.name||"");
  const allDenim=/데님/.test(top.material||"")&&/데님/.test(bottom.material||"");
  if(leatherShoe){sm+=12;reasons.push("질감 대비 12");}
  else if(runShoe&&dressTop){sm+=8;reasons.push("기능화+단정상의 8");}
  else if(allDenim){sm+=9;reasons.push("올데님 9");}
  else {sm+=10;}

  // ===== 실루엣 22 =====
  let sil=0;
  const fB=fitCatOf(bottom);
  const overTop=/오버|over|릴렉스|relax/i.test((top.fit||"")+(top.name||""));
  if(fB==="PREF"||fB==="REGULARish"){sil+=22;reasons.push("스트레이트·레귤러 22");}
  else if(fB==="WIDE"){sil+= overTop?10:18; reasons.push(overTop?"상하 볼륨 과다 10":"와이드 밸런스 18");}
  else if(fB==="SLIM"){sil+= overTop?18:12; reasons.push(overTop?"슬림+오버 18":"슬림 타이트 12");}
  // 신발 볼륨 보정 +2
  if(shoe&&/993|992|990|2002|1906/i.test(shoe.name||"")&&(fB==="PREF"||fB==="REGULARish"||fB==="WIDE"))sil=Math.min(22,sil+2);

  // ===== 격식 15 =====
  let form=0;
  const fset=[formalityOf(top),formalityOf(bottom)].concat(shoe?[formalityOf(shoe)]:[]);
  const fdiff=Math.max(...fset)-Math.min(...fset);
  if(fdiff===0){form+=15;reasons.push("격식 일치 15");}
  else if(fdiff===1){form+=12;reasons.push("시티 캐주얼 12");}
  else {form+=6;reasons.push("격식 편차 6");}

  let base=color+sm+sil+form;

  // ===== 개인 선호 가중 ± =====
  let pref=0;
  // 하의 다크 인디고 +5
  if(/다크인디고|다크 인디고/.test(bottom.color||"")|| (/인디고/.test(bottom.color||"")&&valueOf(bottom)==="DARK")){pref+=5;reasons.push("다크 인디고 +5");}
  else if(/인디고/.test(bottom.color||"")){pref+=5;reasons.push("인디고 +5");}
  // 핏 선호 (5-B + 하이브리드 5-C)
  if(fB==="PREF"){pref+=5;reasons.push("레귤러·스트레이트 +5");}
  else if(fB==="SLIM"){pref-=2;reasons.push("슬림 −2");}
  else if(fB==="WIDE"){
    const volShoe=shoe&&/993|992|990|2002|1906/i.test(shoe.name||"");
    if(volShoe){reasons.push("와이드+볼륨 스니커즈 예외 0");}
    else {pref-=4;reasons.push("와이드 −4");}
  }

  const total=base+pref;
  let grade= total>=90?"A":total>=75?"B":total>=60?"C":"X";
  return {invalid:false,base:Math.round(base),pref,total:Math.round(total),grade,reasons,comps:{color,sm,sil,form}};
}

// 아우터 정합 점수 — 톤·아침저녁 기온·격식·색 겹침·비·최근 착용을 종합 (후보별 아우터 배정용)
function outerFit(slots,outer,o){
  if(!outer)return -99;
  o=o||{};const top=slots.top,bottom=slots.bottom;
  let s=0;
  const ot=toneOf(outer);
  if(ot===toneOf(top))s+=3;else if(ot==="NEUTRAL")s+=2;                       // 톤 정합 (뉴트럴은 무난하지만 톤 일치보다 낮게)
  if(o.t!=null){const f=tempFit(outer,o.t);s+=f==="in"?2:f==="edge"?0:-3;}     // 아침·저녁 체감 적정
  s+=Math.abs(formalityOf(outer)-formalityOf(top))<=1?1:-1;                    // 상의와 격식 일치
  const dk=/네이비|인디고|navy|indigo/i;
  if(bottom&&dk.test(outer.color||"")&&dk.test(bottom.color||""))s-=1;         // 네이비 아우터 + 인디고 하의 색 뭉침 (약한 감점)
  if(bottom&&/데님|denim/i.test(outer.material||"")&&/데님|denim/i.test(bottom.material||""))s-=1;   // 청청
  if(o.rain&&/발수|방수|윈드|폴리|테크니컬|리펠런트|water|repellent|nylon/i.test(_txt(outer)))s+=2;  // 비 오는 날 기능 소재
  if(o.recent&&o.recent.has(outer.code))s-=1;                                  // 최근 7일 착용 아우터는 로테이션
  return s;
}

    if(style==="biz")score+=isBridle?3:isGrain?2:isBraid?0:1;
    else if(style==="minimal")score+=isBridle||isGrain?2:isBraid?1:0;
    else score+=isBraid?3:isGrain?2:0;

    // 3. 같은 화면의 세 코디에서 한 벨트가 독점하지 않도록 강한 로테이션 페널티
    score-=(beltUsage.get(belt.code)||0)*6;
    return score;
  }
  function beltForOutfit(slots,style){
    if(!belts.length||!slots?.bottom)return null;
    const tt=itemText(slots.top);
    const likelyHidden=style==="casual"&&/그래픽|오버사이즈|릴렉스|반팔|tee|티셔츠/.test(tt)&&!/셔츠|폴로/.test(tt);
    if(likelyHidden)return null; // 풀아웃 상의라 벨트가 보이지 않으면 억지로 추천하지 않음
    const belt=belts.slice().sort((a,b)=>beltScore(b,slots,style)-beltScore(a,slots,style)||String(a.code).localeCompare(String(b.code)))[0];
    if(belt)beltUsage.set(belt.code,(beltUsage.get(belt.code)||0)+1);
    return belt||null;
  }
  function accessoryLayer(style,slots){
    // 실제 보유 우선, 없으면 placeholder(제안 틀)
    const out=[];
    if(style==="minimal"||style==="biz"){
      out.push(watches[0]||{placeholder:"가죽 스트랩 시계 — '준비된 룩'의 완성"});
      if(bracelets[0])out.push(bracelets[0]); else if(style==="minimal")out.push({placeholder:"실버 체인 팔찌 (선택)"});
    }else if(watches[0])out.push(watches[0]);
    const belt=beltForOutfit(slots,style);
    if(belt)out.push(belt);
    return out;
  }
  ACCESSORY_REFRESHER=codis=>{
    beltUsage.clear();
    codis.forEach(c=>{c.accessories=accessoryLayer(c.style,c.slots);});
    return codis;
  };

  const R=[];

  // 1 업무 (스마트 캐주얼 ~ 비즈니스)
  {
    const s=t+DOY+REROLL[0];
    const top=pick(smartTops.length?smartTops:wantTops,s);
    const bottom=pick(workBottoms.length?workBottoms:(chinos.length?chinos:bottoms0),s+1);
    const wShoes=cleanShoes.length?cleanShoes:(dressShoes.length?dressShoes:sneakers);
    const shoe=shoeForTPO(wShoes.length?wShoes:shoes0,s+2);
    const wOuter=needO?((blazers[0]||pick(smartOuter,s+3)||pick(wantOuter,s+3))||null):null;
    // 업무: 정장 아우터가 없을 때만 셔츠 레이어 시도 (데님 셔츠 등)
    const wLayer=(!wOuter&&t<24)?pickShirtLayer(top,s+5):null;
    R.push({title:"업무",vibe:"단정한 스마트 캐주얼 · 출근·미팅",accent:"#4a5a7a",style:"biz",
      slots:{outer:wOuter,shirtLayer:wLayer,top,bottom,shoe},
      perfume:pick(perfumes.filter(p=>/우드|세이지|페어|wood|sage/i.test((p.name||"")+(p.brand||""))).length?perfumes.filter(p=>/우드|세이지|페어|wood|sage/i.test((p.name||"")+(p.brand||""))):perfumes,s),
      accessories:accessoryLayer("biz",{outer:wOuter,shirtLayer:wLayer,top,bottom,shoe}),
      bag:bagSuggest(),
      texture:textureNote(top,bottom),
      fit:{top:fitGuide(top,"top",t),bottom:fitGuide(bottom,"bottom",t)},
      tuck:tuckGuide({top,bottom,shoe},accs)});
  }

  // 2 데이트 (단정하면서 멋낸 스마트 캐주얼)
  {
    const s=t+DOY+REROLL[1];
    // 데이트: 깔끔한 셔츠·니트 + 다크 인디고 데님 우선 + 가죽/미니멀 스니커즈
    let dTops=tops0.filter(i=>(/셔츠|폴로/.test(i.name||"")&&!/티셔츠|t셔츠/i.test(i.name||""))&&!isHeavy(i)).concat(
      t<26?tops0.filter(i=>/니트/.test(i.name||"")&&!isHeavy(i)):[]
    ).filter((v,idx,a)=>a.indexOf(v)===idx);
    if(t>=26){const polos=tops0.filter(i=>subOf(i)==="카라티");dTops=polos.concat(dTops).filter((v,idx,a)=>a.indexOf(v)===idx);}
    if(!dTops.length)dTops=smartTops;
    const dBottoms=(darkDenim.length?darkDenim:denim).filter(notWide);
    const dBottomsF=dBottoms.length?dBottoms:(denim.length?denim:bottoms0);
    const dShoes=cleanShoes.length?cleanShoes:sneakers;
    const top=pick(dTops.length?dTops:wantTops,s+5);
    const bottom=pick(dBottomsF,s+5);
    const shoe=shoeForTPO(dShoes.length?dShoes:shoes0,s+6);
    // 데이트 향수: 우디·플로럴 계열 우선
    const dPerf=perfumes.filter(p=>/우드|플라워|피오니|가이악|레이지|wood|flower|peony/i.test((p.name||"")+(p.brand||"")));
    R.push({title:"데이트",vibe:"단정하면서 멋낸 스마트 캐주얼",accent:"#7a4a6b",style:"minimal",
      slots:{outer:needO?pick(smartOuter.length?smartOuter:wantOuter,s+7):null,shirtLayer:pickShirtLayer(top,s+8),top,bottom,shoe},
      perfume:pick(dPerf.length?dPerf:perfumes,s+1),
      accessories:accessoryLayer("minimal",{outer:needO?pick(smartOuter.length?smartOuter:wantOuter,s+7):null,shirtLayer:pickShirtLayer(top,s+8),top,bottom,shoe}),
      bag:bagSuggest(),
      texture:textureNote(top,bottom),
      fit:{top:fitGuide(top,"top",t),bottom:fitGuide(bottom,"bottom",t)},
      tuck:tuckGuide({top,bottom,shoe},accs)});
  }

  // 3 자유 (편한 캐주얼 · 비 오면 방수 우선)
  {
    let vibe,accent,slots;
    const s=t+DOY+REROLL[2];
    if(rain){
      const ws=shoes.filter(i=>/방수|gtx|고어|ecco/i.test((i.note||"")+(i.brand||"")));
      const top=pick(freeTops.length?freeTops:wantTops,s+8),bottom=pick(bottoms0.filter(i=>/다크|블랙|네이비|인디고/.test(i.color||"")),s)||pick(denim.length?denim:bottoms0,s+9);
      vibe="비 오는 날 발 안 젖는 편한 캐주얼";accent="#c97b4a";
      slots={outer:pick(outers0.filter(i=>/윈드|폴리|블루종/.test((i.name||"")+(i.material||""))),s)||pick(outers0,s),top,bottom,shoe:pick(ws.length?ws:sneakers,s)};
    }else{
      const top=pick(freeTops.length?freeTops:wantTops,s+8);
      const bottom=pick(denim.length?denim:bottoms0,s+9);
      vibe="편하고 가벼운 데일리 캐주얼";accent="#c97b4a";
      slots={outer:needO?pick(wantOuter,s+12):null,top,bottom,shoe:shoeForTPO(sneakers.length?sneakers:shoes0,s+11)};
    }
    // 자유: 셔츠 레이어 적극 시도 (그래픽티 위에 데님/체크 셔츠)
    slots.shirtLayer=pickShirtLayer(slots.top,s+13);
    R.push({title:"자유",vibe,accent,style:"casual",slots,perfume:pick(perfumes,s+2),
      accessories:accessoryLayer("casual",slots),bag:bagSuggest(),
      texture:textureNote(slots.top,slots.bottom),
      fit:{top:fitGuide(slots.top,"top",t),bottom:fitGuide(slots.bottom,"bottom",t)},
      tuck:tuckGuide(slots,accs)});
  }
  // 각 코디에 원본 슬롯 번호 부여 (REROLL 인덱스 추적용)
  R.forEach((c,i)=>{c.origin=i;});
  // ===== 최근 7일 착용 조합 회피 =====
  // 착용된 조합이면 상의→하의→신발 순으로 대체 후보를 시도해 시그니처를 바꾼다
  R.forEach(c=>{
    if(!isWornRecently(codiSig(c.slots),7))return;
    const tryRoles=[["top",tops0],["bottom",bottoms0],["shoe",shoes0]];
    outer: for(const [role,pool] of tryRoles){
      const cur=c.slots[role]; if(!cur)continue;
      // 온도 맞는 대체 후보를 순회 (같은 소분류 우선 → 전체)
      const sameSub=pool.filter(x=>x.code!==cur.code&&subOf(x)===subOf(cur)&&tempFit(x,t)!=="out");
      const others=pool.filter(x=>x.code!==cur.code&&tempFit(x,t)!=="out");
      for(const cand of sameSub.concat(others)){
        const trial={...c.slots,[role]:cand};
        if(!isWornRecently(codiSig(trial),7)){c.slots[role]=cand;c.avoidedWorn=true;break outer;}
      }
    }
  });
  // 최근 착용 회피로 하의나 신발이 교체됐을 수 있으므로 최종 슬롯 기준으로 벨트를 다시 계산한다.
  ACCESSORY_REFRESHER(R);
  // v3 점수화: 각 코디에 점수·등급·근거 부여 (+ 온도 적합도 반영)
  R.forEach(c=>{
    const sc=scoreCore(c.slots.top,c.slots.bottom,c.slots.shoe);
    if(sc&&!sc.invalid){
      // 온도 살짝 벗어남(edge) → 슬롯당 −3 감점
      let edgePenalty=0; const edgeItems=[];
      ["top","bottom","shoe","outer"].forEach(role=>{
        const it=c.slots[role]; if(!it)return;
        const tf=tempFit(it,t);
        if(tf==="edge"){edgePenalty-=3;edgeItems.push(ROLE_LABEL[role]);}
      });
      // 계절 가중: 현재 계절과 안 맞는(사계절 아님) 슬롯당 −2
      let seasonPenalty=0; const seasonItems=[];
      ["top","bottom","outer"].forEach(role=>{  // 신발은 사계절 비중이 커서 제외
        const it=c.slots[role]; if(!it)return;
        if(!seasonMatch(it,t)){seasonPenalty-=2;seasonItems.push(ROLE_LABEL[role]);}
      });
      c.score=sc.total+edgePenalty+seasonPenalty;c.base=sc.base;c.prefBonus=sc.pref+edgePenalty+seasonPenalty;
      c.reasons=sc.reasons
        .concat(edgeItems.length?["온도 경계 "+edgeItems.join("·")+" −"+(edgeItems.length*3)]:[])
        .concat(seasonItems.length?["계절감 "+seasonItems.join("·")+" −"+(seasonItems.length*2)]:[]);
      c.grade=c.score>=90?"A":c.score>=75?"B":c.score>=60?"C":"X";
      // 대안 상의 1종 함께 제안 (현재 상의 제외, 같은 조합에서 최고점)
      if(c.slots.top){
        let best=null,bestS=-1;
        tops0.forEach(tp=>{
          if(tp.code===c.slots.top.code)return;
          const r=scoreCore(tp,c.slots.bottom,c.slots.shoe);
          if(r&&!r.invalid&&r.total>bestS){bestS=r.total;best=tp;}
        });
        if(best)c.altTop={item:best,score:Math.round(bestS)};
      }
    }
    else {c.score=null;c.grade=sc?"X":null;c.invalidReason=sc&&sc.reason;c.reasons=[];}
  });
  // 대안 상의: 같은 하의·신발 기준 차선 상의 계산 (지배적 상의 편중 완화)
  R.forEach(c=>{
    if(c.score==null||!c.slots.top)return;
    const curRaw=scoreCore(c.slots.top,c.slots.bottom,c.slots.shoe);
    let best=null,bestS=-1;
    tops0.forEach(tp=>{
      if(tp.code===c.slots.top.code)return;
      if(c.slots.shirtLayer&&tp.code===c.slots.shirtLayer.code)return;
      const sc=scoreCore(tp,c.slots.bottom,c.slots.shoe);
      if(sc&&!sc.invalid&&sc.total>bestS){bestS=sc.total;best=tp;}
    });
    if(best&&curRaw&&!curRaw.invalid){c.altTop={item:best,delta:Math.round(bestS-curRaw.total)};}
  });
  // 상황(업무·데이트·자유) 고정 순서 유지 — 정렬하지 않음. 점수는 배지로만 표시.
  return R;
}

// 코디의 slots → 표시용 pieces 배열
function codiPieces(c){
  return [c.slots.outer,c.slots.top,c.slots.bottom,c.slots.shoe].filter(Boolean);
}
// 특정 역할의 대체 아이템 풀
function altPool(role,items,w){
  const wearable=items.filter(i=>useOf(i)!=="홈웨어");
  const C=c=>wearable.filter(i=>i.cat===c);
  if(role==="outer")return C("OT");
  if(role==="shirtLayer")return wearable.filter(i=>i.cat==="TP"&&/셔츠|체크|플란넬|옥스포드/.test(i.name||"")&&!/티셔츠|t셔츠/i.test(i.name||""));
  if(role==="top")return C("TP");
  if(role==="bottom")return C("BT");
  if(role==="shoe")return C("SH");
  return [];
}

// ====== 코디 기록 (일별 확정 · 평가 · 학습) ======
const REC_KEY="codi:records:v1";
function loadRecs(){try{return JSON.parse(localStorage.getItem(REC_KEY)||"[]");}catch(e){return[];}}
function saveRecs(list){try{localStorage.setItem(REC_KEY,JSON.stringify(list));return true;}catch(e){alert("저장 공간이 가득 찼어요. 기록 사진 일부를 삭제해 주세요.");return false;}}
function recForDate(date){return loadRecs().find(r=>r.date===date)||null;}
function upsertRec(rec){const list=loadRecs().filter(r=>r.date!==rec.date);list.push(rec);list.sort((a,b)=>a.date<b.date?-1:1);return saveRecs(list);}
function deleteRec(date){saveRecs(loadRecs().filter(r=>r.date!==date));}
function updateRec(date,fn){const list=loadRecs();const r=list.find(x=>x.date===date);if(!r)return;fn(r);saveRecs(list);}
function itemByCode(code){return ITEMS.find(i=>i.code===code)||null;}
function itemLabel(code){const i=itemByCode(code);return i?((i.brand?i.brand+" ":"")+i.name):code;}

// ===== 별점 학습: 평가 기반 아이템 경험치 보정 (−4 ~ +4) =====
let BOOSTS={},PANEL_RECSTATS={n:0,rated:0};
function refreshBoosts(){
  const recs=loadRecs();
  PANEL_RECSTATS={n:recs.length,rated:recs.filter(r=>r.rating).length};
  const m={};
  recs.forEach(r=>{if(!r.rating)return;(r.codes||[]).forEach(cd=>{(m[cd]=m[cd]||[]).push(r.rating);});});
  BOOSTS={};
  Object.keys(m).forEach(cd=>{
    const arr=m[cd],avg=arr.reduce((a,b)=>a+b,0)/arr.length;
    BOOSTS[cd]=Math.round((avg-3)*2*Math.min(1,arr.length/3)*10)/10;
  });
}
function itemBoost(code){return BOOSTS[code]||0;}

      const dressy=c.slots.shoe&&/로퍼|구두|더비|드레스/.test(c.slots.shoe.name||"");
      if(dressy){sc=Math.min(100,sc+5);cm+=" 비즈니스 모드에 맞는 슈즈 선택이에요.";}
      else{sc=Math.max(0,sc-8);cm+=" 비즈니스 모드라면 로퍼·더비로 교체를 권해요.";}
    }
    if(TPO.move==="outdoor"&&c.slots.shoe&&/로퍼|구두|더비/.test(c.slots.shoe.name||"")){sc=Math.max(0,sc-6);cm+=" 실외 활동이 많다면 쿠셔닝 있는 신발이 낫겠어요.";}
    sc=Math.max(0,Math.min(100,sc));
    return{score:sc,comment:cm};
  }},
 {id:"data",icon:"📊",name:"김로그",role:"데이터·개인화 분석가",w:.2,
  eval(c){
    let boost=0;(c.codes||[]).forEach(cd=>boost+=itemBoost(cd));
    let sc=Math.max(0,Math.min(100,Math.round(55+c.sc.pref*3+boost*5)));

    else{
      const liked=(c.codes||[]).filter(cd=>itemBoost(cd)>=1).map(cd=>itemLabel(cd));

    }
    if(c.sc.pref>=5)cm+=" 다크 인디고·스트레이트 등 개인 선호와도 잘 맞아요.";
    if(isWornRecently(c.sig,7))cm+=" 단, 최근 7일 내 입은 조합이라 순위를 낮췄어요.";

  }}
];

// 하의 계열 키: 핏군 + 명도 + 데님 여부 — 501·502·LVC처럼 사실상 같은 청바지를 한 계열로 묶어 편중 방지
function bottomFamily(bt){return fitCatOf(bt)+"|"+valueOf(bt)+"|"+(/데님|denim/i.test((bt.material||"")+(bt.name||""))?"denim":"other");}
// 후보 1건에 전문가 5인 평가 + 가중 합의 (내부 후보·외부 의견 기반 후보 공용)
function evalExperts(c){
  c.codes=["outer","top","bottom","shoe"].map(r=>c.slots[r]&&c.slots[r].code).filter(Boolean);
  c.experts=EXPERT_DEFS.map(e=>{const r=e.eval(c);return{id:e.id,icon:e.icon,name:e.name,role:e.role,w:e.w,score:r.score,comment:r.comment};});
  c.consensus=Math.round(c.experts.reduce((a,e)=>a+e.score*e.w,0))-(isWornRecently(c.sig,7)?8:0);
  c.grade=gradeOf(c.consensus);
  return c;
}
// 후보 생성: 옷장 전 조합 채점 → 상위 후보에 전문가 5인 평가 → 합의 점수 순 + 다양성 확보
function genCandidates(items,w,limit){
  refreshBoosts();
  const t=commuteTemp(w);   // 낮 최고기온이 아니라 출퇴근 기온 기준
  const wearable=items.filter(i=>useOf(i)!=="홈웨어");
  const ok=i=>tempFit(i,t)!=="out";
  const byBoost=(a,b)=>itemBoost(b.code)-itemBoost(a.code);
  const pool=(cat,cap,tt)=>{
    const f=wearable.filter(i=>i.cat===cat&&tempFit(i,tt==null?t:tt)!=="out");
    const base=f.length?f:wearable.filter(i=>i.cat===cat);
    return base.slice().sort(byBoost).slice(0,cap);
  };
  const tO=outerTemp(w);
  const tops=pool("TP",18),bottoms=pool("BT",14),shoes=pool("SH",22),outers=(outerRequired(w)?pool("OT",999,tO):[]);   // 가을·겨울·봄은 아우터 필수 (옷장 전체 경쟁)
  const out=[];
  tops.forEach(tp=>bottoms.forEach(bt=>shoes.forEach(sh=>{
    const sc=scoreCore(tp,bt,sh);
    if(!sc||sc.invalid)return;
    let pen=0;
    [tp,bt,sh].forEach(it=>{if(tempFit(it,t)==="edge")pen-=3;});
    [tp,bt].forEach(it=>{if(!seasonMatch(it,t))pen-=2;});
    const slots={outer:null,top:tp,bottom:bt,shoe:sh};
    out.push({slots,sig:codiSig(slots),sc,t,tOuter:tO,raw:sc.total+pen});
  })));
  // 원점수 상위 후보를 회의에 상정 (시그니처 중복 제거 + 상의·하의 쿼터로 특정 아이템 독점 방지)
  out.sort((a,b)=>b.raw-a.raw);
  const seen=new Set(),uniq=[],topCntU={},botCntU={};
  const CAP=60,PER_TOP=6,PER_BOT=6;
  for(const c of out){
    if(seen.has(c.sig))continue;
    const tc=c.slots.top.code,bc=c.slots.bottom.code;
    if((topCntU[tc]||0)>=PER_TOP)continue;   // 한 상의는 최대 PER_TOP 조합까지만 상정
    if((botCntU[bc]||0)>=PER_BOT)continue;   // 한 하의도 최대 PER_BOT 조합까지만 (501/502 편중 방지)
    seen.add(c.sig);uniq.push(c);topCntU[tc]=(topCntU[tc]||0)+1;botCntU[bc]=(botCntU[bc]||0)+1;
    if(uniq.length>=CAP)break;
  }
  // 쿼터로 부족하면 나머지 상위 조합으로 채움
  if(uniq.length<CAP)for(const c of out){
    if(uniq.length>=CAP)break;if(seen.has(c.sig))continue;
    seen.add(c.sig);uniq.push(c);
  }
  // 아우터 배정: 종합 정합 점수 순, 동점은 등록 순서 대신 날짜·조합 해시로 로테이션
  const recentO=recentOuterCodes(w.date,7),dateKey=String(w.date||"").slice(0,10);
  uniq.forEach(c=>{
    if(outers.length){
      c.outerRank=outers.map(o=>({o,s:outerFit(c.slots,o,{t:tO,rain:w.rain,recent:recentO})}))
        .sort((a,b)=>b.s-a.s||hashStr(c.sig+a.o.code+dateKey)-hashStr(c.sig+b.o.code+dateKey));
      c.slots.outer=c.outerRank[0].o;
    }
    c.codes=["outer","top","bottom","shoe"].map(r=>c.slots[r]&&c.slots[r].code).filter(Boolean);
  });
  // 전문가 평가 + 가중 합의
  uniq.forEach(c=>{evalExperts(c);c.tuck=tuckGuide(c.slots,items.filter(i=>i.cat==="AC"));});
  uniq.sort((a,b)=>b.consensus-a.consensus);
  // 다양성 필터: (1) 2슬롯 이상 겹치면 제외 (2) 같은 상의·같은 하의는 쿼터만큼만 — 특정 아이템 독점 방지
  const nTops=new Set(uniq.map(c=>c.slots.top.code)).size;
  const nBots=new Set(uniq.map(c=>bottomFamily(c.slots.bottom))).size;
  const maxPerTop=Math.max(2,Math.ceil(limit/Math.max(1,nTops)));
  const maxPerBot=Math.max(2,Math.ceil(limit/Math.max(1,nBots)));
  const maxPerOuter=Math.max(2,Math.ceil(limit/Math.max(1,outers.length)));
  const picked=[],topCount={},botCount={},outCount={};
  // 아우터 쿼터: 같은 아우터가 쿼터를 넘으면 정합 점수 2점 이내의 차선 아우터로 교체 (없으면 그대로)
  const balanceOuter=c=>{
    if(!c.outerRank)return;
    const cur=c.slots.outer.code;
    if((outCount[cur]||0)<maxPerOuter)return;
    const alt=c.outerRank.find(r=>(outCount[r.o.code]||0)<maxPerOuter&&r.s>=c.outerRank[0].s-2);
    if(alt){c.slots.outer=alt.o;evalExperts(c);}
  };
  const countOuter=c=>{if(c.slots.outer)outCount[c.slots.outer.code]=(outCount[c.slots.outer.code]||0)+1;};
  for(const c of uniq){
    const tc=c.slots.top.code,bc=bottomFamily(c.slots.bottom);
    const dup=picked.some(p=>{let o=0;["top","bottom","shoe"].forEach(r=>{if(p.slots[r]&&c.slots[r]&&p.slots[r].code===c.slots[r].code)o++;});return o>=2;});
    if(dup)continue;
    if((topCount[tc]||0)>=maxPerTop)continue;
    if((botCount[bc]||0)>=maxPerBot)continue;
    balanceOuter(c);
    picked.push(c);topCount[tc]=(topCount[tc]||0)+1;botCount[bc]=(botCount[bc]||0)+1;countOuter(c);
    if(picked.length>=limit)break;
  }
  // 쿼터로도 부족하면 상의·하의 쿼터만 풀어서 채움 (그래도 2슬롯 중복은 유지)
  if(picked.length<limit)for(const c of uniq){
    if(picked.length>=limit)break;if(picked.includes(c))continue;
    const dup=picked.some(p=>{let o=0;["top","bottom","shoe"].forEach(r=>{if(p.slots[r]&&c.slots[r]&&p.slots[r].code===c.slots[r].code)o++;});return o>=2;});
    if(dup)continue;
    balanceOuter(c);picked.push(c);countOuter(c);
  }
  if(picked.length<limit)for(const c of uniq){if(picked.length>=limit)break;if(!picked.includes(c)){balanceOuter(c);picked.push(c);countOuter(c);}}
  return picked;
}

function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
// 의견 통합: 나의 코디네이터 5인 + 점수 있는 외부 의견을 1인 1표로 합산
function integratedScore(top,ext){
  const scored=(ext||[]).filter(o=>o.score!=null&&o.score!=="");
  if(!scored.length)return top.consensus;
  return Math.round((top.consensus*5+scored.reduce((a,o)=>a+ +o.score,0))/(5+scored.length));
}

const EXT_ALIAS_RE=new RegExp(EXT_ALIASES.map(a=>"(?:"+a[0].source+")").join("|"),"g");
const EXT_STOP=new Set(["the","and","of","in","usa","외","등","시리즈","및","or","with"]);
const EXT_PARTICLES=new Set(["은","는","이","가","을","를","과","와","로","의","도","만","에","으로","에서","이라","처럼","보다","에는","와는","과는","로는","까지","부터","이나","나","랑","이랑","이며","며","라면","이면"]);
const EXT_GENERIC=new Set(["셔츠","팬츠","자켓","티셔츠","진","데님","슈즈","핏","코튼","면","신발","상의","하의","아우터","컬러","아이템","모델","클래식","classic","fit","코트","바지","스니커즈","오리지널"]);
function extNormalize(s){
  s=(s||"").toLowerCase().replace(/https?:\/\/\S+/g," ").replace(/[™®©’'`*_#]/g,"");
  return s.replace(EXT_ALIAS_RE,m=>{for(const a of EXT_ALIASES){if(a[2].test(m))return" "+a[1]+" ";}return m;});
}
function extTokenize(s,isText){
  const out=new Set();
  (extNormalize(s).match(/[a-z0-9가-힣]+/g)||[]).forEach(t=>{
    if(EXT_STOP.has(t))return;
    if(t.length<2&&!/\d/.test(t))return;
    out.add(t);
    const m=t.match(/^(\d{3,})[a-z]/);if(m)out.add(m[1]);            // 990v4 → 990
    const m2=t.match(/^([가-힣]{2,})\d+$/);if(m2)out.add(m2[1]);      // 타입2 → 타입
    if(isText&&/[가-힣]$/.test(t)&&t.length>=3){                      // 조사 제거 변형 추가 (슬랙스가 → 슬랙스)
      [1,2].forEach(n=>{const stem=t.slice(0,-n);if(stem.length>=2&&EXT_PARTICLES.has(t.slice(-n)))out.add(stem);});
    }
  });
  return out;
}
let EXT_SPEC_CACHE={},EXT_BRAND_N={};
function extRefreshBrands(){
  EXT_BRAND_N={};EXT_SPEC_CACHE={};
  ITEMS.forEach(i=>{const b=extNormalize(i.brand||"").trim();if(b)EXT_BRAND_N[b]=(EXT_BRAND_N[b]||0)+1;});
}
function extItemSpec(i){
  const key=i.code+"|"+(i.brand||"")+"|"+(i.name||"")+"|"+(i.color||"");
  if(EXT_SPEC_CACHE[key])return EXT_SPEC_CACHE[key];
  const spec=new Map(),put=(t,w)=>{if(!spec.has(t)||spec.get(t)<w)spec.set(t,w);};
  extTokenize(i.name||"").forEach(t=>put(t,/\d/.test(t)?(t.length>=3?3:1):EXT_GENERIC.has(t)?1:2));
  const rare=(EXT_BRAND_N[extNormalize(i.brand||"").trim()]||0)<=2;   // 희소 브랜드는 식별력이 높음
  extTokenize(i.brand||"").forEach(t=>put(t,rare?2:1));
  extTokenize(i.color||"").forEach(t=>put(t,1));
  let total=0;spec.forEach(w=>total+=w);
  return EXT_SPEC_CACHE[key]={spec,total};
}
function extMatch(tokSet,spec){
  let s=0,strong=false,digit=false;
  spec.spec.forEach((w,t)=>{if(tokSet.has(t)){s+=w;if(w>=2)strong=true;if(w>=3)digit=true;}});
  return{score:s,strong,digit,cov:spec.total?s/spec.total:0};
}
function extFindItem(tokSet,cat){
  let best=null;
  ITEMS.forEach(i=>{
    if(i.cat!==cat||useOf(i)==="홈웨어")return;
    const m=extMatch(tokSet,extItemSpec(i));
    if(!m.strong)return;
    if(!(m.digit||m.score>=4||(m.score>=3&&m.cov>=0.6)))return;
    if(!best||m.score>best.m.score||(m.score===best.m.score&&m.cov>best.m.cov))best={item:i,m};
  });
  return best;
}
const EXT_ROLE_WORDS={outer:/^(아우터|겉옷|자켓|재킷|outer|jacket)$/,top:/^(상의|톱|탑|top|셔츠|니트|shirt)$/,bottom:/^(하의|바지|팬츠|bottom|pants)$/,shoe:/^(신발|슈즈|shoes?|footwear|스니커즈)$/,shell:/^(셸|셀|쉘|shell|셔츠\s*레이어|미드|mid)$/};
const EXT_IGNORE_ROW=/^(이너|inner|벨트|belt|양말|socks?|시계|watch|향수|perfume|액세서리|가방|모자|안경|분류|구성|슬롯|항목|시간|구분|카테고리)/i;
function extRoleOfCell(c){
  c=c.replace(/[*_`#]/g,"").trim().toLowerCase();
  for(const r in EXT_ROLE_WORDS)if(EXT_ROLE_WORDS[r].test(c))return r;

  }
  // ===== 의견 통합 =====
  const scoredExt=ext.filter(o=>o.score!=null&&o.score!=="");
  const showMerged=PANEL.integrated===top.sig&&ext.length;
  if(showMerged){
    const ms=integratedScore(top,ext),mg=gradeOf(ms);
    h+=`<div style="margin-top:12px;padding:11px 13px;border-radius:10px;background:#1f2b22;border:1px solid #2e4a38">
      <div style="font-size:11px;font-weight:800;color:#7fb37f;margin-bottom:3px">🧩 의견 통합 결과 — 최종안</div>
      <div style="font-size:12.5px;line-height:1.6">나의 코디네이터 5인(${top.consensus}점) + 외부 ${scoredExt.length}인 합산 → <b>${ms}점 (${mg}등급)</b>${ext.length>scoredExt.length?` · 점수 없는 의견 ${ext.length-scoredExt.length}건은 참고용`:""}</div>`;
    // ----- 외부 의견 기반 후보 -----
    if(extAll.length){
      h+=`<div style="font-size:11px;font-weight:800;color:#5aa0d8;margin-top:10px;padding-top:9px;border-top:1px dashed #2e4a38">🌐 외부 의견 기반 후보 ${extCands.length}건 — 의견 본문에서 옷장 아이템을 찾아 나의 코디네이터 5인이 채점했어요</div>`;
      extAll.forEach(ec=>{
        const src=ec.info||ec.ext;
        const who=`${esc(src.icon)} <b>${esc(src.name)}</b> <span style="color:var(--sub);font-weight:400">${esc(src.role)}</span>`;
        if(ec.fail){
          h+=`<div style="margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)">
            <div style="font-size:12px">${who}</div>
            <div style="font-size:11px;color:#c87a4a;margin-top:3px;line-height:1.5">⚠ ${esc(ec.fail)}</div>
            ${ec.slots?`<div style="display:grid;gap:5px;margin-top:6px;opacity:.7">${panelRows(ec.slots)}</div>`:""}</div>`;
          return;
        }
        const isCur=ec.sig===top.sig,sameAsMine=ec.sig===iTop.sig,inPool=pool.some(p=>p.sig===ec.sig);
        const how=["outer","top","bottom","shoe"].filter(r=>src.matched[r]).map(r=>ROLE_LABEL[r]+"("+src.how[r]+")").join(" · ");
        const filled=src.filled.map(r=>ROLE_LABEL[r]).join("·");
        const w=ec.experts.slice().sort((a,b)=>a.score-b.score)[0];
        h+=`<div style="margin-top:8px;padding:10px 11px;border-radius:9px;background:var(--panel2);border:1px solid ${isCur?"#5aa0d8":"var(--line)"}">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:12px">${who}</span>
            ${gradeBadge(ec.grade,ec.consensus)}
            ${isCur?`<span style="font-size:10.5px;font-weight:800;color:#5aa0d8;margin-left:auto">✓ 현재 최종안${sameAsMine?" · 나의 추천과 동일":""}</span>`
              :sameAsMine?`<span style="font-size:10.5px;color:var(--sub);margin-left:auto">나의 추천과 동일 조합</span>`
              :`<button class="ghost" data-pick="${esc(ec.sig)}" data-pick-ext="1" style="margin-left:auto;padding:4px 12px;font-size:11px;color:var(--ink)">이 후보 선택</button>`}
          </div>
          <div style="display:grid;gap:5px;margin-top:8px">${panelRows(ec.slots)}</div>
          <div style="font-size:10.5px;color:var(--sub);margin-top:6px;line-height:1.5">인식: ${esc(how)}${filled?` · <span style="color:#c9a94a">${esc(filled)}은(는) 옷장에서 못 찾아 나의 추천으로 보완</span>`:""}${!sameAsMine&&inPool?" · 나의 코디네이터 후보에도 있던 조합":""}</div>
          <div style="font-size:11px;color:var(--sub);margin-top:5px;line-height:1.5">💬 ${esc(w.icon+" "+w.name+" "+w.score+"점")}: ${esc(w.comment)}</div>
        </div>`;
      });
      // 결론
      const bestExt=extCands.filter(c=>c.sig!==iTop.sig).sort((a,b)=>b.consensus-a.consensus)[0];
      let concl;
      if(top.ext)concl=`현재 최종안은 <b>${esc(top.ext.name)}</b> 의견 기반 후보(${top.consensus}점)예요. 나의 추천은 ${iTop.consensus}점이었어요.`;
      else if(!bestExt)concl=extCands.length?`외부 의견의 조합이 모두 나의 추천과 같아요 — 최종안 유지.`:`옷장 아이템이 인식된 외부 의견이 없어 나의 코디네이터 추천을 최종안으로 유지해요.`;
      else if(bestExt.consensus>iTop.consensus)concl=`<b>${esc(bestExt.ext.name)}</b> 의견 기반 후보(${bestExt.consensus}점)가 나의 추천(${iTop.consensus}점)보다 높아요 — '이 후보 선택'으로 최종안을 바꿀 수 있어요.`;
      else if(bestExt.consensus===iTop.consensus)concl=`<b>${esc(bestExt.ext.name)}</b> 의견 기반 후보와 나의 추천이 ${iTop.consensus}점 동점이에요 — 취향에 따라 선택하세요.`;
      else concl=`나의 추천(${iTop.consensus}점)이 외부 기반 최고 후보 <b>${esc(bestExt.ext.name)}</b>안(${bestExt.consensus}점)보다 높아 최종안을 유지해요. 원하면 선택해 바꿀 수 있어요.`;
      h+=`<div style="font-size:12px;line-height:1.6;margin-top:10px;padding-top:8px;border-top:1px dashed #2e4a38">🔎 통합 결론: ${concl}</div>`;
    }
    h+=`</div>`;
  }
  if(ext.length&&!showMerged)h+=`<button class="ghost" data-op-merge style="width:100%;margin-top:12px;padding:11px;color:var(--ink);font-weight:700;border:1px solid #2e4a38">🧩 의견 통합 — 내부 5인 + 외부 ${ext.length}인 최종안 만들기</button>`;
  if(existing)h+=`<div style="font-size:11px;color:#c9a94a;margin-top:10px">⚠ ${esc(date)}에 이미 확정한 코디가 있어요 — 다시 확정하면 교체됩니다.</div>`;
  h+=`<div style="display:flex;gap:8px;margin-top:12px">
      <button class="primary" data-confirm style="flex:1">📌 ${esc(date)} 코디로 확정</button>
      <button class="ghost" data-rethink style="padding:11px 14px">🔁 재회의</button>
    </div></div>`;
  // ===== 다른 후보 =====
  if(others.length){
    h+=`<div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">다른 후보 — 마음에 드는 조합을 선택하세요</div><div style="display:grid;gap:10px">`;
    others.forEach((c,k)=>{
      const bestE=c.experts.slice().sort((a,b)=>b.score-a.score)[0];
      h+=`<div class="card" style="padding:13px 15px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:11px;font-weight:800;color:var(--sub)">후보 ${k+2}</span>
          ${gradeBadge(c.grade,c.consensus)}
          <button class="ghost" data-pick="${esc(c.sig)}" style="margin-left:auto;padding:4px 12px;font-size:11px;color:var(--ink)">이 후보 선택</button>
        </div>
        <div style="display:grid;gap:6px">${panelRows(c.slots)}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:7px;line-height:1.5">💬 ${esc(bestE.icon+" "+bestE.name)}: ${esc(bestE.comment)}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  view.innerHTML=h;
  bindWeatherPanel();
  bindPanel(top);
}
function bindPanel(top){
  view.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    PANEL.selSig=b.dataset.pick;
    // 사용자가 고른 조합의 상의는 회피 목록에서 해제 (선택 존중)
    const picked=CURRENT_PANEL_POOL.find(c=>c.sig===b.dataset.pick);
    if(picked)PANEL.excludedTops=PANEL.excludedTops.filter(tc=>tc!==picked.slots.top.code);
    PANEL.integrated=b.hasAttribute("data-pick-ext")?b.dataset.pick:null;render();
  }));
  const rt=view.querySelector("[data-rethink]");
  if(rt)rt.addEventListener("click",()=>{
    // 재회의: 현재 조합 + 현재 상의를 회피해 눈에 띄게 다른 코디를 유도
    if(!PANEL.excluded.includes(top.sig))PANEL.excluded.push(top.sig);
    if(top.slots.top&&!PANEL.excludedTops.includes(top.slots.top.code))PANEL.excludedTops.push(top.slots.top.code);
    if(PANEL.selSig===top.sig)PANEL.selSig=null;
    PANEL.integrated=null;render();
  });
  const rs=document.getElementById("p-reset");
  if(rs)rs.addEventListener("click",()=>{PANEL.excluded=[];PANEL.excludedTops=[];PANEL.selSig=null;render();});
  // 외부 의견: 넣기 / 생성 / 삭제 / 통합
  const oa=view.querySelector("[data-op-add]");
  if(oa)oa.addEventListener("click",()=>{PANEL.addingOp=true;render();});
  const og=view.querySelector("[data-op-gen]");
  if(og)og.addEventListener("click",()=>{
    const date=panelDate(),list=loadExtOps(date);
    list.push(genExternalOp(top,list.length));
    saveExtOps(date,list);PANEL.integrated=null;render();
  });
  view.querySelectorAll("[data-op-del]").forEach(b=>b.addEventListener("click",()=>{
    const date=panelDate(),list=loadExtOps(date);
    list.splice(+b.dataset.opDel,1);saveExtOps(date,list);PANEL.integrated=null;render();
  }));
  const oc=document.getElementById("op-cancel");
  if(oc)oc.addEventListener("click",()=>{PANEL.addingOp=false;render();});
  const os=document.getElementById("op-save");
  if(os)os.addEventListener("click",()=>{
    const comment=val("op-comment").trim();
    if(!comment){alert("의견 내용을 입력해주세요.");return;}
    let score=null;const sRaw=val("op-score").trim();
    if(sRaw!==""){score=Math.round(+sRaw);if(isNaN(score)){alert("점수는 0~100 숫자로 입력해주세요.");return;}score=Math.max(0,Math.min(100,score));}
    const date=panelDate(),list=loadExtOps(date);
    list.push({icon:"🌐",name:val("op-name").trim()||"외부 코디네이터",role:val("op-role").trim()||"스타일 어드바이저",score,comment,ts:Date.now()});
    saveExtOps(date,list);PANEL.addingOp=false;PANEL.integrated=null;render();
  });
  const om=view.querySelector("[data-op-merge]");
  if(om)om.addEventListener("click",()=>{PANEL.integrated=top.sig;render();});
  // 확정: 통합 점수(외부 점수 의견 포함) + 전체 의견 저장
  const cf=view.querySelector("[data-confirm]");
  if(cf)cf.addEventListener("click",()=>{
    const date=panelDate();
    if(recForDate(date)&&!confirm(date+"에 이미 확정한 코디가 있어요. 새 코디로 교체할까요?"))return;
    const ext=loadExtOps(date);
    const fscore=integratedScore(top,ext);
    const rec={date,ts:Date.now(),codes:top.codes,
      roles:{outer:top.slots.outer?top.slots.outer.code:null,top:top.slots.top.code,bottom:top.slots.bottom.code,shoe:top.slots.shoe?top.slots.shoe.code:null},
      score:fscore,grade:gradeOf(fscore),origin:top.ext?("외부 의견 · "+top.ext.name):"패널",
      experts:top.experts.map(e=>({icon:e.icon,name:e.name,role:e.role,score:e.score,comment:e.comment,group:"my"}))
        .concat(ext.map(o=>({icon:o.icon||"🌐",name:o.name,role:o.role,score:o.score,comment:o.comment,group:"ext"}))),
      weather:{high:WEATHER.high,low:WEATHER.low,cond:WEATHER.cond},
      rating:null,memo:"",photo:""};
    if(upsertRec(rec)){
      markWorn(top.sig);
      REC_UI.mode="day";REC_UI.month=date.slice(0,7);REC_UI.sel=date;REC_UI.composing=false;
      currentTab="records";setTab();render();
    }
  });
}

// ===== 기록 탭 (일별 캘린더 · 주별 · 월별) =====
let REC_UI={mode:"day",month:new Date().toISOString().slice(0,7),sel:new Date().toISOString().slice(0,10),composing:false,draft:null};
function fmtD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return fmtD(d);}
function weekStart(ds){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtD(d);}
function shiftMonth(month,delta){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function topCodes(g,n){const cnt={};g.forEach(r=>(r.codes||[]).forEach(cd=>cnt[cd]=(cnt[cd]||0)+1));return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([code,c])=>({code,n:c}));}

function renderRecords(){
  const recs=loadRecs();
  let h=`<div style="display:flex;gap:6px;margin-bottom:14px">
    ${[["day","일별"],["week","주별"],["month","월별"]].map(([m,l])=>`<button class="chip ${REC_UI.mode===m?"on":""}" data-rmode="${m}" style="flex:1">${l}</button>`).join("")}
  </div>`;
  if(!recs.length){
    h+=`<div class="card" style="padding:26px;text-align:center">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">아직 확정한 코디가 없어요</div>
      <div style="font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:14px">전문가 회의에서 확정하거나, 오늘 실제로 입은 조합을 직접 기록하세요.<br>기록과 별점이 다음 추천에 학습돼요.</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="primary" id="rec-go-panel" style="padding:10px 18px">🧑‍🎨 전문가 회의 열기</button>
        <button class="ghost" data-compose style="padding:10px 18px;color:var(--ink)">✍ 직접 기록</button>
      </div>
    </div>`;
    if(REC_UI.composing)h+=`<div style="margin-top:14px">`+renderComposer(REC_UI.sel)+`</div>`;
    view.innerHTML=h;bindRecCommon();bindRecDetail();return;
  }
  if(REC_UI.mode==="day")h+=renderRecDay(recs);
  else if(REC_UI.mode==="week")h+=renderRecWeek(recs);

function renderRecDay(recs){
  const byDate={};recs.forEach(r=>byDate[r.date]=r);
  const [y,m]=REC_UI.month.split("-").map(Number);
  const days=new Date(y,m,0).getDate();
  const startDow=new Date(y,m-1,1).getDay();
  let h=`<div class="card" style="padding:14px;margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button class="ghost" data-mnav="-1" style="padding:5px 13px">‹</button>
      <span style="font-size:14px;font-weight:800">${y}년 ${m}월</span>
      <button class="ghost" data-mnav="1" style="padding:5px 13px">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10.5px;color:var(--sub);text-align:center;margin-bottom:5px">${["일","월","화","수","목","금","토"].map(d=>`<span>${d}</span>`).join("")}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let k=0;k<startDow;k++)h+=`<span></span>`;
  for(let d=1;d<=days;d++){
    const ds=REC_UI.month+"-"+String(d).padStart(2,"0");
    const r=byDate[ds];const sel=REC_UI.sel===ds;
    h+=`<button data-rday="${ds}" style="aspect-ratio:1;border-radius:8px;background:${sel?"var(--panel2)":"transparent"};border:1px solid ${sel?"var(--accent)":"transparent"};color:${r?"var(--ink)":"var(--sub)"};font-size:12px;font-weight:${r?"800":"500"};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
      <span>${d}</span>${r?`<span style="width:6px;height:6px;border-radius:99px;background:${gradeColor(r.grade)}"></span>`:`<span style="height:6px"></span>`}
    </button>`;
  }
  h+=`</div></div>`;
  h+=REC_UI.composing?renderComposer(REC_UI.sel):renderRecDetail(byDate[REC_UI.sel],REC_UI.sel);
  return h;
}

function saveManualRecord(date){
  const g=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const top=itemByCode(g("cp-top")),bottom=itemByCode(g("cp-bottom"));
  if(!top||!bottom){alert("상의와 하의는 꼭 선택해주세요.");return;}
  const outer=itemByCode(g("cp-outer")),shoe=itemByCode(g("cp-shoe"));
  if(recForDate(date)&&!confirm(date+"에 이미 기록이 있어요. 이 조합으로 교체할까요?"))return;
  refreshBoosts();
  const slots={outer,top,bottom,shoe};
  const sc=scoreCore(top,bottom,shoe);
  let experts=[],score=null,grade=null;
  if(sc&&!sc.invalid){
    const cand={slots,sig:codiSig(slots),sc,t:WEATHER.high,codes:[outer,top,bottom,shoe].filter(Boolean).map(i=>i.code)};
    experts=EXPERT_DEFS.map(e=>{const r=e.eval(cand);return{icon:e.icon,name:e.name,role:e.role,score:r.score,comment:r.comment,group:"my"};});
    score=Math.round(EXPERT_DEFS.reduce((a,e,i)=>a+experts[i].score*e.w,0));
    grade=gradeOf(score);
  }
  const rec={date,ts:Date.now(),source:"manual",
    codes:[outer,top,bottom,shoe].filter(Boolean).map(i=>i.code),
    roles:{outer:outer?outer.code:null,top:top.code,bottom:bottom.code,shoe:shoe?shoe.code:null},

// ====== 날씨 (Open-Meteo, 키 불필요) ======
let FORECAST=null;        // 7일 예보 배열 [{date,high,low,code,rainProb}]
let SELECTED_DATE=null;   // 사용자가 고른 날짜 (없으면 오늘)
let MANUAL=null;          // 수동 설정 {high,low,cond,rain} (있으면 예보 무시)

async function fetchWeather(){
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&hourly=temperature_2m&timezone=Asia%2FSeoul&forecast_days=7";
    const res=await fetch(url);
    const j=await res.json();
    const d=j.daily;
    // 출근 직전(08시)·퇴근 직후(19시) 기온 — 사무실 밖에 있는 시간대
    const hourAt=(date,hh)=>{
      const hr=j.hourly; if(!hr||!hr.time)return null;
      const idx=hr.time.indexOf(date+"T"+String(hh).padStart(2,"0")+":00");
      return idx<0?null:Math.round(hr.temperature_2m[idx]);
    };
    FORECAST=d.time.map((date,k)=>({
      date,
      high:Math.round(d.temperature_2m_max[k]),
      low:Math.round(d.temperature_2m_min[k]),
      code:d.weather_code[k],
      rainProb:d.precipitation_probability_max[k]||0,
      tMorning:hourAt(date,8),
      tEvening:hourAt(date,19)
    }));
    if(!SELECTED_DATE)SELECTED_DATE=FORECAST[0].date;
    applyWeather();
  }catch(e){ WEATHER.loading=false; WEATHER.cond="날씨 불러오기 실패(수동 설정 가능)"; renderWeather(); if(currentTab==="today"||currentTab==="panel")render(); }
}

// 선택 날짜·수동 설정을 WEATHER에 반영
function applyWeather(){
  if(MANUAL){
    WEATHER={high:MANUAL.high,low:MANUAL.low,cond:MANUAL.cond,rain:MANUAL.rain,date:(SELECTED_DATE||new Date().toISOString().slice(0,10))+" (수동)",loading:false,manual:true};
  }else if(FORECAST){
    const f=FORECAST.find(x=>x.date===SELECTED_DATE)||FORECAST[0];
    WEATHER={high:f.high,low:f.low,tMorning:f.tMorning,tEvening:f.tEvening,cond:condText(f.code),
      rain:f.rainProb>=50||[51,53,55,61,63,65,80,81,82,95,96,99].includes(f.code),
      date:f.date,loading:false,manual:false};
  }
  renderWeather(); if(currentTab==="today"||currentTab==="panel") render();
}

function condText(c){
  if(c===0)return"맑음"; if([1,2].includes(c))return"대체로 맑음"; if(c===3)return"흐림";
  if([45,48].includes(c))return"안개"; if([51,53,55].includes(c))return"이슬비";
  if([61,63,65,80,81,82].includes(c))return"비"; if([71,73,75,85,86].includes(c))return"눈";
  if([95,96,99].includes(c))return"뇌우"; return"보통";
}

function dayLabel(dateStr,idx){
  const wk=["일","월","화","수","목","금","토"];
  const d=new Date(dateStr+"T00:00:00");
  const md=(d.getMonth()+1)+"/"+d.getDate();
  if(idx===0)return"오늘 "+md;
  if(idx===1)return"내일 "+md;
  return wk[d.getDay()]+" "+md;
}

        <div style="font-size:11.5px;color:var(--sub);margin-bottom:6px">날씨</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${COND_OPTIONS.map(([c])=>`<button class="chip ${MANUAL.cond===c?"on":""}" data-cond="${c}" style="flex:0 0 auto">${c}</button>`).join("")}
        </div>
      </div>
    </div>`;
  }
  h+=`</div>`;
  return h;
}

// 세션 동안 사용자가 수정한 코디 상태 (idx → {role: itemCode})
let CODI_OVERRIDES={};
let CURRENT_CODIS=[];
const ROLE_LABEL={outer:"아우터",shirtLayer:"셔츠",top:"상의",bottom:"하의",shoe:"신발"};

function applyOverrides(codis){
  codis.forEach((c)=>{
    const key=typeof c.origin==="number"?c.origin:codis.indexOf(c);
    const ov=CODI_OVERRIDES[key];if(!ov)return;
    Object.keys(ov).forEach(role=>{
      const it=ITEMS.find(i=>i.code===ov[role]);
      if(it)c.slots[role]=it;
      if(role==="top")c.altTop=null; // 수동 교체 후엔 이전 대안 표시 제거
    });
    // 수정 시 핏/텍스처 가이드 재계산
    c.fit={top:fitGuide(c.slots.top,"top",WEATHER.high),bottom:fitGuide(c.slots.bottom,"bottom",WEATHER.high)};
    c.texture=textureNote(c.slots.top,c.slots.bottom);
    if(!c.tuck)c.tuck=tuckGuide(c.slots,ITEMS.filter(i=>i.cat==="AC"));
    // 수정 시 점수 재계산
    const sc=scoreCore(c.slots.top,c.slots.bottom,c.slots.shoe);
    if(sc&&!sc.invalid){c.score=sc.total;c.base=sc.base;c.prefBonus=sc.pref;c.grade=sc.grade;c.reasons=sc.reasons;c.invalidReason=null;}
    else {c.score=null;c.grade="X";c.invalidReason=sc&&sc.reason;c.reasons=[];}
  });
  return codis;
}

function bindTPO(){
  view.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>{TPO.move=b.dataset.move;CODI_OVERRIDES={};render();}));
  const bz=document.getElementById("tpo-biz");
  if(bz)bz.addEventListener("change",()=>{TPO.biz=bz.checked;CODI_OVERRIDES={};render();});
}

function bindCodiEdits(){
  // 슬롯 교체 (다음 아이템으로 순환)
  view.querySelectorAll("[data-swap]").forEach(b=>b.addEventListener("click",()=>{
    const [idxs,role]=b.dataset.swap.split(":");const idx=+idxs;
    const c=CURRENT_CODIS[idx];const cur=c.slots[role];
    const origin=c&&typeof c.origin==="number"?c.origin:idx;
    const pool=altPool(role,ITEMS,WEATHER);
    if(pool.length<2){toast("교체할 다른 "+ROLE_LABEL[role]+"이(가) 없어요");return;}
    const ci=pool.findIndex(i=>i.code===(cur&&cur.code));
    const next=pool[(ci+1+pool.length)%pool.length];
    CODI_OVERRIDES[origin]=CODI_OVERRIDES[origin]||{};CODI_OVERRIDES[origin][role]=next.code;
    render();
  }));
  // 전체 새로 (해당 코디 시드를 흔들어 새 조합 생성)
  // 대안 상의 적용
  view.querySelectorAll("[data-alttop]").forEach(b=>b.addEventListener("click",()=>{
    const idx=+b.dataset.alttop;const c=CURRENT_CODIS[idx];if(!c||!c.altTop)return;
    const origin=typeof c.origin==="number"?c.origin:idx;
    CODI_OVERRIDES[origin]=CODI_OVERRIDES[origin]||{};CODI_OVERRIDES[origin].top=c.altTop.item.code;
    render();
  }));
  // 대안 상의 적용
  view.querySelectorAll("[data-alttop]").forEach(b=>b.addEventListener("click",()=>{
    const idx=+b.dataset.alttop;const c=CURRENT_CODIS[idx];
    if(!c||!c.altTop)return;
    const origin=typeof c.origin==="number"?c.origin:idx;
    CODI_OVERRIDES[origin]=CODI_OVERRIDES[origin]||{};CODI_OVERRIDES[origin].top=c.altTop.item.code;
    render();
  }));
  // 입었어요 토글 (7일간 이 조합 추천 제외)
  view.querySelectorAll("[data-worn]").forEach(b=>b.addEventListener("click",()=>{
    const idx=+b.dataset.worn;
    const c=CURRENT_CODIS[idx];if(!c)return;
    const sig=codiSig(c.slots);
    if(isWornRecently(sig,7)){unmarkWorn(sig);toast("착용 기록을 취소했어요");}
    else{markWorn(sig);toast("기록됐어요. 이 조합은 7일간 추천에서 빠져요");}
    render();
  }));
  view.querySelectorAll("[data-reroll]").forEach(b=>b.addEventListener("click",()=>{
    const idx=+b.dataset.reroll;
    const c=CURRENT_CODIS[idx];
    const origin=c&&typeof c.origin==="number"?c.origin:idx;
    delete CODI_OVERRIDES[origin];           // 해당 코디의 수동 교체 초기화
    REROLL[origin]=(REROLL[origin]||0)+7;     // 시드 점프(+7)로 다른 조합 유도
    render();
  }));
}

// ====== 대화형 수정 (규칙 기반) ======
let CHAT_LOG=[];
function renderChatLog(){
  const el=document.getElementById("chat-log");if(!el)return;
  el.innerHTML=CHAT_LOG.map(m=>m.role==="user"
    ? `<div style="align-self:flex-end;background:var(--accent);color:#1a1a1a;padding:7px 11px;border-radius:11px 11px 2px 11px;font-size:12.5px;max-width:85%;margin-left:auto">${esc(m.text)}</div>`
    : `<div style="align-self:flex-start;background:var(--panel2);color:var(--ink);padding:7px 11px;border-radius:11px 11px 11px 2px;font-size:12.5px;max-width:90%">${esc(m.text)}</div>`
  ).join("");
  el.scrollTop=el.scrollHeight;
}
function chatSay(text){CHAT_LOG.push({role:"bot",text});renderChatLog();}
function toast(text){chatSay(text);}

function bindChat(){
  const inp=document.getElementById("chat-in"),send=document.getElementById("chat-send");
  if(!inp)return;
  const go=()=>{const t=inp.value.trim();if(!t)return;CHAT_LOG.push({role:"user",text:t});inp.value="";handleChat(t);};
  send.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}

function targetCodiIdx(text){
  const m=text.match(/코디\s*([123])/);if(m)return +m[1]-1;
  return 0; // 기본 코디1
}
function handleChat(text){
  const t=text.replace(/\s/g,"");
  const idx=targetCodiIdx(text);
  // TPO 변경
  if(/지하철|버스|대중교통|transit/i.test(t)){TPO.move="transit";CODI_OVERRIDES={};chatSay("지하철·버스 이동에 맞춰 거치적거림 적은 가방과 편한 신발 위주로 바꿨어요.");render();return;}
  if(/실외|야외|아웃도어|걷|outdoor/i.test(t)){TPO.move="outdoor";CODI_OVERRIDES={};chatSay("실외 활동에 맞춰 쿠셔닝 좋은 신발과 수납 가방으로 조정했어요.");render();return;}
  if(/비즈니스|회사|출근|격식|블레이저|biz/i.test(t)){TPO.biz=true;CODI_OVERRIDES={};chatSay("코디2를 비즈니스 캐주얼로 바꿨어요. 블레이저와 드레스 슈즈를 더했어요.");render();return;}
  if(/캐주얼하게|편하게|가볍게|더캐주얼/i.test(t)){TPO.biz=false;TPO.move="mixed";CODI_OVERRIDES={};chatSay("더 편안한 캐주얼 톤으로 풀었어요.");render();return;}
  // 슬롯 교체
  const roleMap=[["shoe",/신발|운동화|슈즈|스니커|로퍼|구두/],["bottom",/하의|바지|팬츠|데님|청바지|진|슬랙스/],["top",/상의|티|셔츠|니트|탑/],["outer",/아우터|자켓|코트|블루종|점퍼/]];
  for(const [role,re] of roleMap){
    if(re.test(t)){
      const c=CURRENT_CODIS[idx];const cur=c.slots[role];const pool=altPool(role,ITEMS,WEATHER);
      if(pool.length<2){chatSay("교체할 다른 "+ROLE_LABEL[role]+"이(가) 옷장에 부족해요.");return;}
      const ci=pool.findIndex(i=>i.code===(cur&&cur.code));const next=pool[(ci+1+pool.length)%pool.length];
      CODI_OVERRIDES[idx]=CODI_OVERRIDES[idx]||{};CODI_OVERRIDES[idx][role]=next.code;
      chatSay(`코디${idx+1}의 ${ROLE_LABEL[role]}을(를) ${next.brand?next.brand+" ":""}${next.name}(으)로 바꿨어요.`);render();return;
    }
  }
  // 롤업/턱인 안내
  if(/롤업|걷어|기장/.test(t)){chatSay("28도 안팎이면 밑단 1~2회 롤업으로 발목을 드러내면 시각적으로 시원해요. 데님·치노에 특히 잘 어울려요.");return;}
  if(/턱인|넣어|tuck/i.test(t)){chatSay("셔츠·폴로는 앞만 살짝 넣는 '프렌치 턱'이 비율에 유리하고, 오버핏 티는 빼서 입는 편이 자연스러워요.");return;}
  if(/새로|다시|바꿔만|랜덤/.test(t)){CODI_OVERRIDES={};render();chatSay("세 코디를 다시 뽑았어요.");return;}
  // 도움말
  chatSay('이렇게 말해보세요: "코디1 신발 바꿔줘", "더 캐주얼하게", "비즈니스로", "지하철 많이 타", "롤업 어때"');
}

function bindWeatherPanel(){
  // 날짜 칩
  view.querySelectorAll("[data-date]").forEach(b=>b.addEventListener("click",()=>{
    SELECTED_DATE=b.dataset.date; MANUAL=null; applyWeather();
  }));
  // 수동 토글
  const mt=document.getElementById("w-manual");
  if(mt)mt.addEventListener("change",()=>{
    if(mt.checked){
      const base=(FORECAST&&(FORECAST.find(x=>x.date===SELECTED_DATE)||FORECAST[0]))||{high:WEATHER.high,low:WEATHER.low};
      MANUAL={high:base.high,low:base.low,cond:condText(base.code!=null?base.code:0)||"맑음",rain:false};
      // cond/ rain 초기값 보정
      if(!COND_OPTIONS.some(([c])=>c===MANUAL.cond))MANUAL.cond="맑음";
      MANUAL.rain=(COND_OPTIONS.find(([c])=>c===MANUAL.cond)||[,false])[1];
    }else{MANUAL=null;}
    applyWeather();
  });
  // 수동 기온
  const wh=document.getElementById("w-high"),wl=document.getElementById("w-low");
  if(wh){wh.addEventListener("input",()=>{MANUAL.high=+wh.value;applyWeatherKeepPanel();});wh.addEventListener("change",()=>{MANUAL.high=+wh.value;applyWeather();});}
  if(wl){wl.addEventListener("input",()=>{MANUAL.low=+wl.value;applyWeatherKeepPanel();});wl.addEventListener("change",()=>{MANUAL.low=+wl.value;applyWeather();});}
  // 수동 날씨
  view.querySelectorAll("[data-cond]").forEach(b=>b.addEventListener("click",()=>{
    MANUAL.cond=b.dataset.cond;
    MANUAL.rain=(COND_OPTIONS.find(([c])=>c===b.dataset.cond)||[,false])[1];
    applyWeather();
  }));
}
// 기온 입력 중 포커스 유지를 위해 코디만 갱신
function applyWeatherKeepPanel(){
  if(MANUAL)WEATHER={...WEATHER,high:MANUAL.high,low:MANUAL.low};
  renderWeather();
}

// 색상을 그룹으로 정규화 (필터용)
function colorGroup(color){
  const c=(color||"").toLowerCase();
  if(!c)return"기타";
  if(/인디고|네이비|블루|블루|navy|indigo|blue|데님/.test(c))return"블루·인디고";
  if(/블랙|차콜|black|charcoal|caviar/.test(c))return"블랙";
  if(/화이트|아이보리|크림|white|ivory/.test(c))return"화이트·아이보리";
  if(/그레이|회색|melange|멜란지|gray|grey/.test(c))return"그레이";
  if(/베이지|카멜|탄|오트밀|brown|브라운|beige|khaki|카키/.test(c))return"베이지·브라운";
  return"기타";
}
// 용도 추론 (note·name·카테고리에서)
function useOf(i){
  const n=(i.name||"").toLowerCase(), t=(n+(i.note||"")).toLowerCase();
  if(i.use)return i.use;
  if(/홈웨어|집에서만|실내복/.test(t))return"홈웨어";
  // 신발은 종류로 세분
  if(i.cat==="SH"){
    if(/fresh foam|fuelcell|노바|슈퍼블라스트|860|1080/i.test(n))return"운동";
    if(/로퍼|구두|더비|부츠|드레스/i.test(n))return"업무·포멀";
    return"캐주얼";
  }
  if(/출근|비즈니스|미팅|슬랙스|로퍼|구두|해링턴|블레이저|옥스포드|폴로/i.test(t))return"업무·포멀";
  if(/운동|러닝|짐|트레이닝/i.test(t))return"운동";
  if(/이너|레이어드|심리스|에어리즘/i.test(t))return"이너·기본";
  if(/그래픽|캐주얼|시티|아메리카나|포인트|반팔|릴렉스|오버/i.test(t)||/티셔츠/.test(n))return"캐주얼";
  if(i.cat==="PF")return"향수";
  if(i.cat==="AC")return"소품";
  return"공용";
}

// ====== 전체 백업 (JSON, 사진 포함) ======
function exportBackup(){
  const payload={app:"codi-wardrobe",version:1,exportedAt:new Date().toISOString(),count:ITEMS.length,items:ITEMS};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="codi-백업-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function handleBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=JSON.parse(reader.result);}catch(e){alert("백업 파일을 읽지 못했어요. 올바른 JSON 백업 파일인지 확인해주세요.");return;}
    const arr=Array.isArray(data)?data:(data&&Array.isArray(data.items)?data.items:null);
    if(!arr){alert("이 파일에서 옷장 데이터를 찾지 못했어요.");return;}
    const valid=arr.filter(i=>i&&i.name);
    if(!valid.length){alert("복원할 항목이 없어요.");return;}
    const photoN=valid.filter(i=>i.photo).length;
    if(!confirm(`백업 복원: ${valid.length}벌${photoN?` (사진 ${photoN}장 포함)`:""}\n\n현재 옷장을 이 백업으로 전체 교체합니다. 계속할까요?`))return;
    ITEMS=valid.map(i=>({...i,cat:CATEGORIES[i.cat]?i.cat:"UN"}));
    if(save(ITEMS)){
      CLOSET.cat="ALL";renderWeather();render();
      alert("복원 완료 · 현재 "+ITEMS.length+"벌");
    }
  };
  reader.readAsText(file,"utf-8");
}

// ====== CSV 입출력 ======
const CSV_FIELDS=["code","cat","sub","brand","name","size","color","pattern","fit","material","price","date","note","tmin","tmax","season"];
const CSV_HEADERS=["품목코드","카테고리","소분류","브랜드","모델명","사이즈","색상","패턴","핏","소재","가격","구매일","비고","최저온도","최고온도","계절"];

function csvCell(v){v=(v==null?"":String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  const rows=[CSV_HEADERS.join(",")];
  ITEMS.forEach(i=>rows.push(CSV_FIELDS.map(f=>csvCell(i[f])).join(",")));
  const csv="\uFEFF"+rows.join("\r\n"); // BOM for Excel 한글
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="codi-옷장-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// 헤더 한글/영문 모두 인식
const HEADER_MAP={};
CSV_HEADERS.forEach((h,idx)=>HEADER_MAP[h]=CSV_FIELDS[idx]);
CSV_FIELDS.forEach(f=>HEADER_MAP[f]=f);

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch=='"'){if(text[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch=='"')q=true;
      else if(ch==","){row.push(cur);cur="";}
      else if(ch=="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else if(ch=="\r"){}
      else cur+=ch;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}

function handleCSVFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const rows=parseCSV(reader.result);
      if(rows.length<2){alert("데이터 행이 없어요. 첫 줄은 헤더, 둘째 줄부터 항목이어야 합니다.");return;}
      const head=rows[0].map(h=>h.trim());
      const fieldByCol=head.map(h=>HEADER_MAP[h]||null);
      const parsed=[];
      for(let r=1;r<rows.length;r++){
        const obj={};
        rows[r].forEach((val,c)=>{const f=fieldByCol[c];if(f)obj[f]=val.trim();});
        if(!obj.name)continue;
        if(!obj.cat||!CATEGORIES[obj.cat])obj.cat="UN";
        parsed.push(obj);
      }
      if(!parsed.length){alert("인식된 항목이 없어요. '모델명'(name) 열이 있는지 확인해주세요.");return;}
      openImportModal(parsed);
    }catch(e){alert("CSV를 읽는 중 문제가 생겼어요: "+e.message);}
  };
  reader.readAsText(file,"utf-8");
}

function openImportModal(parsed){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px";
  ov.innerHTML=`<div class="card" style="padding:22px;max-width:380px;width:100%">
    <div style="font-size:17px;font-weight:800;margin-bottom:6px">CSV 가져오기</div>
    <div style="font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:18px"><b style="color:var(--ink)">${parsed.length}개</b> 항목을 읽었어요. 어떻게 반영할까요?</div>
    <div style="display:grid;gap:9px">
      <button class="primary" data-mode="merge" style="text-align:left;padding:13px">기존 목록에 추가 (병합)<div style="font-size:11px;font-weight:500;color:#1a1a1a;opacity:.7;margin-top:2px">같은 품목코드는 새 내용으로 덮어씀</div></button>
      <button class="ghost" data-mode="replace" style="text-align:left;padding:13px;color:var(--ink)">전체 교체 (덮어쓰기)<div style="font-size:11px;font-weight:500;color:var(--sub);margin-top:2px">현재 옷장을 지우고 이 파일로 교체</div></button>
      <button class="ghost" data-mode="cancel" style="padding:11px">취소</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{
    if(e.target===ov){ov.remove();return;}
    const btn=e.target.closest("[data-mode]");if(!btn)return;
    const mode=btn.dataset.mode;
    if(mode==="cancel"){ov.remove();return;}
    applyImport(parsed,mode);
    ov.remove();
  });
}

function applyImport(parsed,mode){
  // 코드 없는 항목은 카테고리별 다음 코드 자동 부여
  if(mode==="replace"){
    const used={};
    ITEMS=[];
    parsed.forEach(p=>{
      if(!p.code){const cat=p.cat;used[cat]=(used[cat]||0)+1;p.code=cat+String(used[cat]).padStart(3,"0");}
    });
    ITEMS=parsed.slice();
  }else{ // merge
    parsed.forEach(p=>{
      if(p.code){
        const idx=ITEMS.findIndex(i=>i.code===p.code);
        if(idx>=0)ITEMS[idx]={...ITEMS[idx],...p};
        else ITEMS.push(p);
      }else{
        p.code=nextCode(p.cat);ITEMS.push(p);
      }
    });
  }
  save(ITEMS);
  CLOSET.cat="ALL";
  renderWeather();render();
  alert((mode==="replace"?"전체 교체":"병합")+" 완료 · 현재 "+ITEMS.length+"벌");
}

function val(id){return document.getElementById(id).value;}

// 사진 리사이즈 (가로 최대 800px, JPEG 압축)
function resizePhoto(file,cb){
  const img=new Image();
  const fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{
    const max=800,scale=Math.min(1,max/img.width);
    const w=Math.round(img.width*scale),hh=Math.round(img.height*scale);
    const cv=document.createElement("canvas");cv.width=w;cv.height=hh;
    cv.getContext("2d").drawImage(img,0,0,w,hh);
    try{cb(cv.toDataURL("image/jpeg",0.72));}catch(e){alert("이미지를 처리하지 못했어요.");}
  };img.onerror=()=>alert("이미지를 읽지 못했어요.");img.src=fr.result;};
  fr.readAsDataURL(file);
}

// URL에서 이미지 불러와 압축 (CORS 실패 시 onfail 호출)
function resizePhotoFromUrl(url,cb,onfail){
  // 1차: crossOrigin으로 로드 시도 → 성공 시 canvas 압축
  const img=new Image();
  img.crossOrigin="anonymous";
  let done=false;
  const timer=setTimeout(()=>{if(!done){done=true;tryFallback();}},12000);
  function tryFallback(){
    // 2차: crossOrigin 없이 로드해 '표시는 되는지' 확인 후 원본 URL 저장
    const img2=new Image();
    let done2=false;
    const t2=setTimeout(()=>{if(!done2){done2=true;onfail&&onfail();}},12000);
    img2.onload=()=>{if(done2)return;done2=true;clearTimeout(t2);onfail&&onfail();};
    img2.onerror=()=>{if(done2)return;done2=true;clearTimeout(t2);onfail&&onfail();};
    img2.src=url;
  }
  img.onload=()=>{
    if(done)return;done=true;clearTimeout(timer);
    try{
      const max=800,scale=Math.min(1,max/img.width);
      const w=Math.round(img.width*scale),hh=Math.round(img.height*scale);
      const cv=document.createElement("canvas");cv.width=w;cv.height=hh;
      cv.getContext("2d").drawImage(img,0,0,w,hh);
      const data=cv.toDataURL("image/jpeg",0.72); // CORS 오염 시 throw
      cb(data,true);
    }catch(e){ tryFallback(); }
  };
  img.onerror=()=>{
    if(done)return;done=true;clearTimeout(timer);
    tryFallback();
  };
  img.src=url;
}

function startEdit(code){
  const it=ITEMS.find(i=>i.code===code);if(!it)return;
  window._editCode=code;
  window._draft={cat:it.cat,sub:it.sub||"",brand:it.brand||"",name:it.name||"",size:it.size||"",color:it.color||"",material:it.material||"",note:it.note||"",photo:it.photo||"",pattern:it.pattern||"",fit:it.fit||"",price:it.price||"",date:it.date||"",tmin:it.tmin!=null?it.tmin:"",tmax:it.tmax!=null?it.tmax:"",season:it.season||""};
  currentTab="add";setTab();render();
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.tab==="add"){window._editCode=null;window._draft=null;}
  currentTab=b.dataset.tab;setTab();render();
}));
view.addEventListener("click",e=>{
  const del=e.target.closest("[data-del]"); if(del){e.stopPropagation();const it=ITEMS.find(i=>i.code===del.dataset.del);if(confirm((it?it.name:"이 항목")+" 을(를) 삭제할까요?")){ITEMS=ITEMS.filter(i=>i.code!==del.dataset.del);save(ITEMS);renderWeather();render();}return;}
  const ed=e.target.closest("[data-edit]"); if(ed){startEdit(ed.dataset.edit);return;}
});
document.getElementById("wbadge").addEventListener("click",()=>{
  MANUAL=null; SELECTED_DATE=FORECAST?FORECAST[0].date:null; WEATHER.loading=true; renderWeather();
  if(FORECAST){applyWeather();}else{fetchWeather();}
});

// ====== 시작 ======
renderWeather(); render(); fetchWeather();
</script>
</body>
</html>
